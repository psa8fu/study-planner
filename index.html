<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Planner</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#fff; --surface-2:#faf9f6; --ink:#25272b; --muted:#6e727a;
  --line:#e8e5df; --line-strong:#d4d0c8; --accent:#4e7396; --accent-ink:#fff; --accent-soft:#e6eef5;
  --danger:#b5524a; --today:#fbf8ef;
  --locked:#5d6470; --locked-bg:#e9ebee;
  --movable:#3f7f74; --movable-bg:#e2f0ec;
  --skip:#9a6a2f; --skip-bg:#f7ecdc;
  --opt:#7a6a9a; --opt-bg:#f0ecf6;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17181b; --surface:#202226; --surface-2:#25272c; --ink:#e6e6e3; --muted:#9a9ea6;
    --line:#2f3238; --line-strong:#3d4047; --accent:#7ea3c4; --accent-ink:#111; --accent-soft:#26323d;
    --danger:#de7f76; --today:#24252a;
    --locked:#aeb5c0; --locked-bg:#2c3037;
    --movable:#7cc2b5; --movable-bg:#1f3330;
    --skip:#d9a865; --skip-bg:#352b1e;
    --opt:#b6a6d6; --opt-bg:#2b2735;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:330px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-size:16px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-grid;place-items:center;color:var(--accent-ink);font-size:12px}
.weeknav{display:flex;align-items:center;gap:6px}
.weeklabel{min-width:150px;text-align:center;font-weight:500}
aside{border-right:1px solid var(--line);background:var(--surface-2);padding:16px;overflow:auto;max-height:calc(100vh - 57px)}
main{padding:16px 20px;min-width:0;display:flex;flex-direction:column;gap:12px}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line)}
.btn.danger{color:var(--danger)}
.btn.icon{padding:6px 9px;line-height:1}
.btn.sm{padding:3px 9px;font-size:13px}

/* ---------- sidebar ---------- */
.tabs{display:flex;gap:2px;background:var(--line);padding:3px;border-radius:9px;margin-bottom:14px}
.tab{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.panel-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:9px 10px;cursor:pointer;transition:border-color .15s,transform .15s}
.item:hover{border-color:var(--line-strong)}
.item:active{transform:scale(.995)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column}
.item-title{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:12px;color:var(--muted)}
.meters{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);align-items:flex-end}
.pips{display:inline-flex;gap:2px;margin-left:4px;vertical-align:middle}
.pips i{width:5px;height:5px;border-radius:50%;background:var(--line-strong)}
.pips i.on{background:var(--ink)}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.badge.locked{background:var(--locked-bg);color:var(--locked)}
.badge.movable{background:var(--movable-bg);color:var(--movable)}
.badge.skippable{background:var(--skip-bg);color:var(--skip)}
.badge.optional{background:var(--opt-bg);color:var(--opt)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:18px 14px;text-align:center;color:var(--muted);font-size:13px}
.empty strong{display:block;color:var(--ink);font-weight:500;margin-bottom:2px}

/* ---------- forms ---------- */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field>span{font-weight:500}
.field input,.field select{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 9px;color:var(--ink);min-width:0}
.field input[type=color]{padding:2px;height:36px;width:56px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:110px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:13px;font-weight:500;color:var(--muted);padding:0;margin-bottom:5px}
.seg{display:flex;flex-wrap:wrap;gap:4px;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none;left:0;top:0;width:1px;height:1px;margin:0}   /* hidden but still focusable; pinned so it never widens the page */
.seg label{border:1px solid var(--line-strong);border-radius:8px;padding:5px 11px;cursor:pointer;background:var(--surface);transition:background .15s,border-color .15s;user-select:none}
.seg input:checked+label{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.error{color:var(--danger);font-size:13px;min-height:1em}
.flex-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.flex-opts label{display:flex;flex-direction:column;gap:2px;padding:8px 10px}
.flex-opts label small{color:var(--muted);font-size:11.5px;line-height:1.3}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:14px;padding:0;width:min(480px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(20,22,26,.35);backdrop-filter:blur(2px)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(6px) scale(.98)}to{transform:none}}  /* no opacity: stays readable even if the animation is paused */
.dlg-body{padding:20px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 80px);overflow:auto}
.dlg-body h2{font-size:17px}
.dlg-actions{display:flex;gap:8px;align-items:center;padding-top:4px}
.spacer{flex:1}

/* ---------- calendar ---------- */
.cal-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.cal{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 150px);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.cal-grid{display:grid;grid-template-columns:52px repeat(7,minmax(86px,1fr));min-width:660px}
.cal-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;font-size:12px;color:var(--muted)}
.cal-head b{display:block;font-size:16px;color:var(--ink);font-weight:600}
.cal-head.today b{color:var(--accent)}
.cal-corner{position:sticky;left:0;z-index:6}
.gutter{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line)}
.hour{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.day{position:relative;border-left:1px solid var(--line)}
.day.today{background-color:var(--today)}
.offhours{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px);opacity:.6;pointer-events:none}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

.blk{position:absolute;border-radius:7px;padding:3px 6px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;text-align:left;border:1px solid transparent;z-index:2;transition:box-shadow .15s,transform .15s,opacity .2s;display:flex;flex-direction:column;gap:1px}
.blk:hover{box-shadow:0 2px 10px rgba(0,0,0,.12);z-index:4}
.blk .t{font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .s{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk svg{flex:none}
.blk.locked{background:var(--locked-bg);border-left:3px solid var(--locked);color:var(--ink)}
.blk.locked .t{color:var(--locked)}
.blk.movable{background:var(--movable-bg);border-color:var(--movable)}
.blk.movable .t{color:var(--movable)}
.blk.skippable{background:repeating-linear-gradient(135deg,var(--skip-bg) 0 6px,var(--surface) 6px 12px);border:1px dashed var(--skip)}
.blk.skippable .t{color:var(--skip)}
.blk.optional{background:var(--opt-bg);border:1px dotted var(--opt);opacity:.85}
.blk.optional .t{color:var(--opt)}

/* study blocks: a wrapper (drag target) holding the main button and the ✓ button */
.blk.study{padding:0;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-left:3px solid var(--c)}
.blk-main{border:0;background:none;color:var(--ink);font:inherit;text-align:left;width:100%;height:100%;padding:3px 22px 3px 6px;display:flex;flex-direction:column;gap:1px;cursor:inherit;border-radius:inherit;overflow:hidden}
.blk-main:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.blk .pin{color:var(--c);font-size:14px;line-height:0;margin-right:1px}
.chk{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--c);background:var(--surface);display:grid;place-items:center;padding:0;cursor:pointer;color:transparent;transition:background .15s,color .15s,transform .15s}
.chk:hover{color:var(--c);transform:scale(1.1)}
.chk[aria-pressed="true"]{background:var(--c);color:#fff}
.blk.study.done{opacity:.6}
.blk.study.done .t{text-decoration:line-through}
.blk.study.missed{border-style:dashed;opacity:.55}
.blk[data-drag]{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.blk.movable.pinned{border-style:solid;border-width:1px 1px 1px 3px}
.blk.dragging{cursor:grabbing;z-index:10;transition:none;box-shadow:0 10px 28px rgba(0,0,0,.22);transform:scale(1.02)}
.blk.invalid{outline:2px solid var(--danger);outline-offset:-1px}
.drag-time{position:absolute;right:4px;bottom:2px;font-size:10.5px;font-weight:600;background:var(--surface);color:var(--ink);padding:0 5px;border-radius:4px;white-space:nowrap;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis}
.blk.invalid .drag-time{color:var(--danger)}
.drop-window{position:absolute;left:0;right:0;z-index:1;pointer-events:none;background:color-mix(in srgb,var(--movable) 14%,transparent);border-block:2px dashed var(--movable);animation:fadein .15s}
.drop-window span{position:absolute;top:2px;left:4px;font-size:10.5px;color:var(--movable);font-weight:600}
.cal.dragging-study .day.drop-ok{background-color:color-mix(in srgb,var(--accent) 7%,transparent)}
.cal.dragging-study .day.drop-no{background-color:color-mix(in srgb,var(--ink) 7%,transparent)}
.cal.dragging-study .day.drop-no>.blk:not(.dragging){opacity:.45}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* explain-why tooltip */
.tip{position:fixed;z-index:60;width:max-content;max-width:290px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--shadow);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.4;pointer-events:none}
.tip-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-left:3px solid var(--c);padding-left:7px;margin-bottom:6px}
.tip-head span{color:var(--muted);font-size:12px;white-space:nowrap}
.tip-sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.tip ul,.why-list{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:2px}
.tip-foot{margin-top:6px;color:var(--muted);font-size:11.5px}

/* "This session" panel in the course editor */
.session-box{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;font-size:13px}
.session-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.session-head span{color:var(--muted)}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.blk.conflict{outline:2px solid var(--danger);outline-offset:-1px}
.summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-right:auto;font-size:13px;color:var(--muted)}
.summary b{color:var(--ink);font-weight:600}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line-strong)}
.chip.warn{background:var(--skip-bg);color:var(--skip);border-color:transparent}
.chip.ok{background:var(--movable-bg);color:var(--movable);border-color:transparent}
.chip.muted{color:var(--muted)}
.item-sub.short{color:var(--skip)}
.blk.ghost{z-index:1;background:transparent;border:1px dashed var(--line-strong);opacity:.7;justify-content:flex-end}
.blk.ghost .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.blk.ghost:hover{opacity:1;box-shadow:none}

/* conflict banner */
.banner{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:slide .22s ease-out}
.banner.warn{background:var(--skip-bg);border:1px solid color-mix(in srgb,var(--skip) 30%,transparent)}
.banner.info{background:var(--surface);border:1px solid var(--line)}
.banner:focus{outline:none}
@keyframes slide{from{transform:translateY(-4px)}to{transform:none}}  /* no opacity: text stays readable even if the animation is paused */
.banner-head{display:flex;align-items:center;gap:8px}
.banner-head h2{font-size:15px}
.banner-icon{width:20px;height:20px;border-radius:50%;background:var(--skip);color:var(--skip-bg);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.banner-sub{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.banner-note{margin:0;font-size:13px;color:var(--muted)}
.short-list,.sugg-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.short-list li{display:flex;gap:8px;align-items:baseline;font-size:13.5px}
.short-list .dot{transform:translateY(1px)}
.short-amt{color:var(--skip)}
.muted{color:var(--muted)}
.sugg{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;flex-wrap:wrap}
.sugg-text{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.sugg-text small{color:var(--skip);display:flex;align-items:center;gap:4px}
.sugg-btns{display:flex;gap:6px}
.skipped-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.skip-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:99px;padding:2px 4px 2px 10px;text-decoration:line-through;text-decoration-color:var(--muted)}
.skip-chip .linkbtn{text-decoration:none}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 6px;border-radius:6px;font-size:13px}
.linkbtn:hover{background:var(--accent-soft)}
.cal-empty{position:absolute;inset:60px 0 0 52px;display:grid;place-items:center;pointer-events:none;z-index:6}
.cal-empty .card{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;text-align:center;max-width:340px;box-shadow:var(--shadow)}
.cal-empty h3{font-size:16px;margin-bottom:4px}
.cal-empty p{color:var(--muted);margin:0 0 14px}
.cal-empty .row{justify-content:center}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Stage 4: header controls ---------- */
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--accent);color:var(--accent-ink);padding:8px 12px;border-radius:8px;text-decoration:none}
.skip:focus{left:16px}
.cal:focus{outline:none}
.viewtoggle{display:flex;background:var(--line);padding:2px;border-radius:8px;gap:2px}
.vt{border:0;background:transparent;padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px;transition:background .15s,color .15s}
.vt[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.menu{position:relative}
.menu summary{list-style:none;user-select:none}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:190px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;animation:pop .14s ease-out}
.menu-pop button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--surface-2)}
.menu-pop .danger{color:var(--danger)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* ---------- progress sidebar ---------- */
.week-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:16px;display:flex;flex-direction:column;gap:7px}
.wc-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.wc-row span,.wc-sub{font-size:12.5px;color:var(--muted)}
.wc-sub b{color:var(--ink);font-weight:500}
.short{color:var(--skip)}
.course-card{align-items:flex-start}
.count{flex:none;width:44px;height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);line-height:1}
.count b{font-size:17px;font-weight:650}
.count small{font-size:10px;color:var(--muted);margin-top:2px}
.count.urgent{background:var(--c);color:#fff}
.count.urgent small{color:rgba(255,255,255,.85)}
.bar{display:flex;height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;transition:width .35s ease}
.bar-done{background:var(--c)}
.bar-plan{background:color-mix(in srgb,var(--c) 35%,transparent)}
.meters-inline{display:flex;gap:10px;align-items:center}
.empty-act{margin-top:10px}
.kbd-help{margin:18px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.8}
kbd{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}

/* ---------- calendar polish ---------- */
.exam-pill{display:block;margin:4px auto 0;max-width:100%;font-size:10.5px;font-weight:600;color:#fff;background:var(--c);border-radius:99px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.enter{animation:blkin .28s ease-out}
@keyframes blkin{from{transform:translateY(4px) scale(.97)}to{transform:none}}  /* transform only, so a paused animation never hides a block */
.blk.ghost.dropped{border-style:dotted;border-color:var(--opt);cursor:default}
.blk.ghost.dropped .t{text-decoration:none}
.blk .s.why{color:var(--muted);font-style:italic}
body:not(.detailed) .blk .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- course deadlines editor ---------- */
.dl-box legend small{font-weight:400}
.dl-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
dialog.mid{width:min(640px,calc(100vw - 32px))}
/* two lines per deadline: [type][title][date][✕] / [prep h][weekly][until][estimate] */
.dl-row{display:grid;grid-template-columns:136px minmax(0,1fr) 150px 34px;grid-template-areas:"type title date del" "hours rep until until" "est est est est";gap:6px 8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.dl-type{grid-area:type}.dl-title{grid-area:title}.dl-date{grid-area:date}.dl-del{grid-area:del;justify-self:end}
.dl-hours-wrap{grid-area:hours}.dl-rep{grid-area:rep}.dl-until-wrap{grid-area:until}.dl-est{grid-area:est}
.dl-row select,.dl-row input:not([type=checkbox]){border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:5px 7px;color:var(--ink);min-width:0;font-size:13px;width:100%}
.dl-hours-wrap,.dl-until-wrap{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dl-hours-wrap input{width:62px!important}
.dl-until-wrap input{width:auto!important;margin-left:4px}
.dl-est{font-size:12px;color:var(--muted)}
@media (max-width:560px){
  .dl-row{grid-template-columns:1fr 1fr 34px;grid-template-areas:"type date del" "title title title" "hours rep rep" "until until until" "est est est"}
}

/* ---------- Quick add ---------- */
dialog.wide{width:min(860px,calc(100vw - 32px))}
.field textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink);font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical;min-height:96px}
.field span small{font-weight:400;color:var(--muted)}
code{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.qa-format-box{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.qa-format-label{font-size:12.5px;color:var(--muted)}
.qa-format{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.qa-format span{background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:7px;padding:3px 10px;font-size:13px;font-weight:600}
.qa-format span.opt{background:transparent;border-style:dashed;font-weight:500}
.qa-format span small{font-weight:400;color:var(--muted)}
.qa-format i{font-style:normal;font-weight:700;color:var(--muted);padding:0 1px}
.qa-example{font-size:12.5px}
.qa-rows{display:flex;flex-direction:column;gap:10px}
.qa-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;animation:slide .2s ease-out}
.qa-row.bad{border-color:color-mix(in srgb,var(--skip) 55%,transparent)}
.qa-src{padding:0;font-size:12.5px;color:var(--muted);max-width:100%}
.qa-src code{white-space:pre-wrap;word-break:break-word}
.qa-msgs{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.qa-bad{color:var(--skip);font-weight:500}
.qa-note{color:var(--muted);font-style:italic}
/* two lines per class: [name][location][flexibility] / [days][start][end] */
.qa-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 122px 122px;grid-template-areas:"name name loc flex" "days days start end";gap:8px;align-items:end}
.qa-grid .field{min-width:0}
.qa-name{grid-area:name}.qa-loc{grid-area:loc}.qa-flex{grid-area:flex}.qa-days{grid-area:days}.qa-start{grid-area:start}.qa-end{grid-area:end}
.qa-grid input,.qa-grid select{width:100%}
.seg.mini{gap:2px;flex-wrap:wrap}
.seg.mini label{padding:5px 6px;font-size:12px;min-width:26px;text-align:center}
.qa-opts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px}
.chk-line{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chk-line input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}
.qa-date{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:3px 6px;color:var(--ink)}
@media (max-width:760px){
  .qa-grid{grid-template-columns:1fr 1fr;grid-template-areas:"name name" "days days" "start end" "loc loc" "flex flex"}
}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr}
  aside{border-right:0;border-top:1px solid var(--line);max-height:none;order:3}   /* phones: calendar first, setup below */
  main{order:2}
  .kbd-help{display:none}
  .topbar{padding:10px 16px}
  main{padding:12px 16px}
  .cal{max-height:75vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="skip" href="#cal">Skip to calendar</a>
<div class="app">
  <header class="topbar">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true">✓</span>Study Planner</h1>
    <nav class="weeknav" aria-label="Week navigation">
      <button class="btn icon" id="prevWeek" aria-label="Previous week" title="Previous week ( [ )">‹</button>
      <span class="weeklabel" id="weekLabel" aria-live="polite"></span>
      <button class="btn icon" id="nextWeek" aria-label="Next week" title="Next week ( ] )">›</button>
      <button class="btn sm" id="thisWeek" title="This week (T)">Today</button>
    </nav>
    <div class="viewtoggle" role="group" aria-label="Detail level">
      <button class="vt" id="viewSimple" aria-pressed="true">Simple</button>
      <button class="vt" id="viewDetailed" aria-pressed="false" title="Toggle with D">Detailed</button>
    </div>
    <details class="menu" id="dataMenu">
      <summary class="btn sm">Data <span aria-hidden="true">▾</span></summary>
      <div class="menu-pop" role="menu">
        <button role="menuitem" data-act="load-sample">Load sample data</button>
        <button role="menuitem" id="exportBtn">Export JSON</button>
        <button role="menuitem" id="importBtn">Import JSON…</button>
        <hr>
        <button role="menuitem" class="danger" id="clearAll">Clear all</button>
      </div>
    </details>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </header>

  <aside aria-label="Planner setup">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="courses" id="tab-courses" aria-controls="panel">Courses</button>
      <button class="tab" role="tab" data-tab="commitments" id="tab-commitments" aria-controls="panel">Commitments</button>
      <button class="tab" role="tab" data-tab="settings" id="tab-settings" aria-controls="panel">Settings</button>
    </div>
    <section id="panel" role="tabpanel"></section>
    <p class="kbd-help"><b>Shortcuts</b> <kbd>[</kbd> <kbd>]</kbd> weeks · <kbd>T</kbd> today · <kbd>D</kbd> detail · <kbd>Alt</kbd>+arrows move the focused block · <kbd>Esc</kbd> close</p>
  </aside>

  <main>
    <section id="banner" class="banner" aria-live="polite" aria-label="Schedule conflicts" hidden></section>
    <div class="cal-toolbar">
      <div class="summary" id="summary" aria-live="polite"></div>
      <div class="legend" aria-label="Flexibility legend" id="legend"></div>
    </div>
    <div class="cal" id="cal" tabindex="-1" aria-label="Weekly calendar"></div>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle"><form id="dlgForm" class="dlg-body" novalidate></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script>
"use strict";
/* =========================================================
   Constants & helpers
   ========================================================= */
const STORE_KEY = 'studyPlanner.v1';
const PPM = 0.9;                       // pixels per minute on the grid
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const PALETTE = ['#5b84b1','#6aa37a','#d0913a','#b8625a','#8e72a8','#4f9a94','#c27ba0','#7d8a52'];
const PREF_WINDOWS = { morning:[360,720], afternoon:[720,1020], evening:[1020,1260], night:[1260,1440] };
const FLEX = {
  locked:   { label:'Locked',    desc:'Never moves or gets skipped' },
  movable:  { label:'Movable',   desc:'Slides within an earliest–latest window' },
  skippable:{ label:'Skippable', desc:'Can be dropped if the week is overloaded' },
  optional: { label:'Optional',  desc:'Only scheduled if there is free time' },
};
// Kinds of deadlines a course can have.
// hours: default prep time (scaled by difficulty/confidence); exams use the original formula instead.
// lead: how many days before the due date prep starts (null = from today).
const DL_TYPES = {
  exam:         { label:'Exam',         short:'Exam',    hours:null, lead:null },
  project:      { label:'Project',      short:'Project', hours:8,    lead:null },
  paper:        { label:'Paper / essay', short:'Paper',  hours:6,    lead:null },
  presentation: { label:'Presentation', short:'Present', hours:4,    lead:14 },
  pset:         { label:'Problem set',  short:'P-set',   hours:3,    lead:7 },
  quiz:         { label:'Quiz',         short:'Quiz',    hours:1,    lead:5 },
  reading:      { label:'Reading',      short:'Reading', hours:1.5,  lead:4 },
  other:        { label:'Other',        short:'Due',     hours:2,    lead:7 },
};
const MAX_LEAD = 14;

const ICON = {
  locked:'<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7.5" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.7" fill="none"/></svg>',
  movable:'<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h13M4.5 5 1.5 8l3 3M11.5 5l3 3-3 3" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  skippable:'<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l7 5-7 5z" fill="currentColor"/><rect x="11" y="3" width="2.2" height="10" rx="1" fill="currentColor"/></svg>',
  optional:'<svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-dasharray="2.4 2"/></svg>',
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

// time: minutes since midnight
const toMin = t => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); };
const toHHMM = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
function fmtTime(m) {
  let h = Math.floor(m / 60), mm = m % 60;
  const ap = (h % 24) >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return h + (mm ? ':' + String(mm).padStart(2, '0') : '') + ap;
}
const fmtRange = (a, b) => fmtTime(a) + '–' + fmtTime(b);
function fmtDur(min) { const h = Math.floor(min / 60), m = min % 60; return (h ? h + 'h' : '') + (m ? (h ? ' ' : '') + m + 'm' : (h ? '' : '0m')); }

// dates (local, no timezone surprises)
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(startOfDay(d), -((d.getDay() + 6) % 7));
const daysUntil = s => Math.round((parseYmd(s) - startOfDay(new Date())) / 864e5);
const fmtDate = (d, o = { month:'short', day:'numeric' }) => d.toLocaleDateString(undefined, o);

/* =========================================================
   State & persistence
   ========================================================= */
function defaultState() {
  return {
    version: 1,
    settings: { wake:'07:00', sleep:'23:00', sessionLen:50, breakLen:10, maxStudyHours:4, preferred:['morning','afternoon'] },
    courses: [],        // {id,name,color,difficulty,confidence,deadlines:[{id,type,title,date,hours,repeat,until}]}
    commitments: [],    // {id,name,days:[0-6],flex,start,end,earliest,latest,duration}
    weeks: {},          // per-week overrides (moves, skips, completions) – used from Stage 2 on
    ui: { weekOffset:0, tab:'courses', detailed:false },
  };
}
function migrate(s) {
  const d = defaultState();
  if (!s || typeof s !== 'object') return d;
  const out = {
    ...d, ...s,
    settings: { ...d.settings, ...(s.settings || {}) },
    ui: { ...d.ui, ...(s.ui || {}) },
    courses: Array.isArray(s.courses) ? s.courses : [],
    commitments: Array.isArray(s.commitments) ? s.commitments : [],
    weeks: s.weeks && typeof s.weeks === 'object' ? s.weeks : {},
  };
  // older versions stored one exam date per course: turn it into an Exam deadline
  const examKey = {};
  out.courses = out.courses.map(c => {
    c = { ...c, id: c.id || uid() };
    if (!Array.isArray(c.deadlines)) {
      c.deadlines = c.examDate ? [{ id: 'ex-' + c.id, type: 'exam', title: 'Exam', date: c.examDate, hours: null, repeat: false, until: '' }] : [];
      if (c.examDate) examKey[c.id] = 'ex-' + c.id + '@' + c.examDate;
    }
    delete c.examDate;
    c.deadlines = c.deadlines.filter(x => x && x.date).map(x => ({ id: x.id || uid(), type: DL_TYPES[x.type] ? x.type : 'other', title: x.title || '', date: x.date,
      hours: +x.hours > 0 ? +x.hours : null, repeat: !!x.repeat, until: x.until || '' }));
    return c;
  });
  // link saved study sessions from the old version to that exam
  Object.values(out.weeks).forEach(w => (w.sessions || []).forEach(p => { if (!p.tk && examKey[p.courseId]) p.tk = examKey[p.courseId]; }));
  return out;
}
function load() { try { const raw = localStorage.getItem(STORE_KEY); if (raw) return migrate(JSON.parse(raw)); } catch (e) {} return defaultState(); }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
let state = load();

function commit(msg) { save(); render(); if (msg) toast(msg); }

const wakeMin = () => toMin(state.settings.wake);
const sleepMin = () => { const s = toMin(state.settings.sleep); return s === 0 ? 1440 : s; };
const weekStart = () => addDays(mondayOf(new Date()), state.ui.weekOffset * 7);

/* =========================================================
   Sample data (generic, dates relative to today)
   ========================================================= */
function sampleState() {
  const s = defaultState();
  const today = startOfDay(new Date());
  const exam = (d, title) => [{ id:uid(), type:'exam', title, date:ymd(d), hours:null, repeat:false, until:'' }];
  // one exam per week, each on that class's meeting day: first a Thursday at least 2 days away,
  // then Wednesday, Tuesday and Friday of the following three weeks
  let first = addDays(today, 2);
  while (first.getDay() !== 4) first = addDays(first, 1);
  const wk = mondayOf(first);
  s.courses = [
    { id:uid(), name:'Chemistry',  color:'#b8625a', difficulty:4, confidence:2, deadlines:exam(first, 'Exam 1') },
    { id:uid(), name:'Calculus',   color:'#5b84b1', difficulty:4, confidence:3, deadlines:exam(addDays(wk, 9), 'Midterm') },
    { id:uid(), name:'History',    color:'#d0913a', difficulty:3, confidence:3, deadlines:exam(addDays(wk, 15), 'Midterm') },
    { id:uid(), name:'Psychology', color:'#6aa37a', difficulty:2, confidence:4, deadlines:exam(addDays(wk, 25), 'Exam 1') },
  ];
  // 2 classes on Mon/Wed/Fri, 2 on Tue/Thu, one club, and the gym
  s.commitments = [
    { id:uid(), name:'Calculus',     days:[0,2,4], flex:'locked',    start:'09:00', end:'09:50', location:'Math Building 101' },
    { id:uid(), name:'Psychology',   days:[0,2,4], flex:'locked',    start:'11:00', end:'11:50', location:'Hall 204' },
    { id:uid(), name:'Chemistry',    days:[1,3],   flex:'locked',    start:'09:30', end:'10:45', location:'Science Center 110' },
    { id:uid(), name:'History',      days:[1,3],   flex:'locked',    start:'14:00', end:'15:15', location:'Humanities 302' },
    { id:uid(), name:'Club meeting', days:[2],     flex:'skippable', start:'19:00', end:'20:00', location:'Student Center' },
    { id:uid(), name:'Gym',          days:[0,2,4], flex:'movable',   earliest:'16:00', latest:'20:00', duration:60 },
  ];
  s.ui.tab = 'courses';
  return s;
}

/* =========================================================
   Rendering
   ========================================================= */
function render() {
  refreshPlan();                 // rebuild the week's schedule from the current data
  // view mode: a class on <body> lets CSS adjust density; buttons report which is on
  document.body.classList.toggle('detailed', !!state.ui.detailed);
  $('#viewSimple').setAttribute('aria-pressed', !state.ui.detailed);
  $('#viewDetailed').setAttribute('aria-pressed', !!state.ui.detailed);
  renderBanner();
  renderSummary();
  renderWeekLabel();
  renderTabs();
  renderPanel();
  renderLegend();
  renderCalendar();
}

function renderWeekLabel() {
  const ws = weekStart(), we = addDays(ws, 6);
  const sameMonth = ws.getMonth() === we.getMonth();
  $('#weekLabel').textContent = fmtDate(ws) + ' – ' + (sameMonth ? we.getDate() : fmtDate(we)) + ', ' + we.getFullYear();
}

function renderTabs() {
  $$('.tab').forEach(t => {
    const on = t.dataset.tab === state.ui.tab;
    t.setAttribute('aria-selected', on);
    t.tabIndex = on ? 0 : -1;
  });
  $('#panel').setAttribute('aria-labelledby', 'tab-' + state.ui.tab);
}

function renderPanel() {
  const p = $('#panel');
  if (state.ui.tab === 'courses') p.innerHTML = coursesPanel();
  else if (state.ui.tab === 'commitments') p.innerHTML = commitmentsPanel();
  else p.innerHTML = settingsPanel();
  if (state.ui.tab === 'settings') bindSettings();
}

const pips = n => '<span class="pips" aria-hidden="true">' + [1,2,3,4,5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('') + '</span>';

// "Midterm (exam) Fri, Nov 13 · in 4 days" for the next thing due
function examText(c) {
  const nx = upcoming(c, 1)[0];
  if (!nx) return (c.deadlines || []).length ? 'No upcoming deadlines' : 'No deadlines yet: add one to plan study';
  const n = dayDiff(nx.due, new Date()), d = fmtDate(nx.due, { weekday:'short', month:'short', day:'numeric' });
  const when = n === 0 ? 'today' : n === 1 ? 'tomorrow' : `in ${n} days`;
  return `${dlName(nx.dl)} due ${d} · ${when}`;
}

// Completed minutes per course across every week (for the "overall" line)
function doneAllTime() {
  const out = {};
  Object.values(state.weeks).forEach(w => (w.sessions || []).forEach(p => { if (p.done) out[p.courseId] = (out[p.courseId] || 0) + p.len; }));
  return out;
}

// Progress bar: done (solid) + still planned (light), as a share of this week's target
function progressBar(done, planned, target, color, label) {
  const pct = v => target ? clamp(v / target * 100, 0, 100) : 0;
  const d = pct(done), p = Math.min(100 - d, pct(Math.max(0, planned - done)));
  return `<span class="bar" style="--c:${esc(color)}" role="img" aria-label="${esc(label)}"><i class="bar-done" style="width:${d}%"></i><i class="bar-plan" style="width:${p}%"></i></span>`;
}

// Big countdown to the next deadline on each course card
function countdownHtml(c) {
  const nx = upcoming(c, 1)[0];
  const n = nx ? dayDiff(nx.due, new Date()) : -1;
  const [big, small] = n < 0 ? ['–', 'none'] : n === 0 ? ['!', 'today'] : [String(n), n === 1 ? 'day' : 'days'];
  const urgent = n >= 0 && n <= 3 ? ' urgent' : '';
  return `<span class="count${urgent}" style="--c:${esc(c.color)}" aria-hidden="true"><b>${big}</b><small>${small}</small></span>`;
}

function weekOverview() {
  if (!plan || !state.courses.length) return '';
  const planned = plan.studyTotal;
  const done = plan.courses.reduce((a, x) => a + x.doneWeek, 0);
  const target = plan.courses.reduce((a, x) => a + x.need, 0);
  // soonest thing due across all courses
  const next = state.courses.map(c => ({ c, nx: upcoming(c, 1)[0] })).filter(v => v.nx && v.nx.due > startOfDay(new Date()))
    .sort((a, b) => a.nx.due - b.nx.due)[0];
  const nDays = next ? dayDiff(next.nx.due, new Date()) : 0;
  const isThis = state.ui.weekOffset === 0;
  return `<div class="week-card">
    <div class="wc-row"><b>${isThis ? 'This week' : 'Week of ' + fmtDate(plan.ws)}</b><span>${fmtDur(done)} studied of ${fmtDur(planned)} planned</span></div>
    ${progressBar(done, planned, Math.max(target, planned), 'var(--accent)', `Studied ${fmtDur(done)} of ${fmtDur(planned)} planned`)}
    <div class="wc-sub">${next ? `Next due: <b>${esc(next.c.name)}</b> · ${esc(dlName(next.nx.dl))} in ${nDays} day${nDays > 1 ? 's' : ''}` : 'Nothing due soon'}${plan.shortfalls.length ? ` · <span class="short">${plan.shortfalls.length} course${plan.shortfalls.length > 1 ? 's' : ''} short</span>` : ''}</div>
  </div>`;
}

function coursesPanel() {
  const head = `<div class="panel-head"><h2>Courses</h2><span class="row" style="gap:6px"><button class="btn sm" data-act="quick-add" title="Type or paste your class schedule">⚡ Quick add</button><button class="btn sm primary" data-act="add-course">+ Add</button></span></div>`;
  if (!state.courses.length) return head + `<div class="empty"><strong>No courses yet</strong>Add each class with its exams, projects, papers or quizzes so the planner knows what to prioritize.<div class="empty-act row" style="justify-content:center;gap:6px"><button class="btn sm" data-act="quick-add">Paste your class schedule</button><button class="btn sm" data-act="load-sample">Load sample data</button></div></div>`;
  const det = state.ui.detailed, allDone = doneAllTime();
  const ranked = plan.courses.filter(x => x.need > 0).sort((a, b) => b.prio - a.prio).map(x => x.c.id);
  // soonest deadline first; courses with nothing upcoming go last
  const nextDue = c => { const nx = upcoming(c, 1)[0]; return nx ? +nx.due : Infinity; };
  const sorted = [...state.courses].sort((a, b) => nextDue(a) - nextDue(b));
  return weekOverview() + head + '<ul class="list">' + sorted.map(c => {
    const x = courseStats(c.id) || { need: 0, placed: 0, doneWeek: 0 };
    const short = x.need - x.placed >= 15;
    const passed = !upcoming(c, 1).length;
    const studied = `Studied ${fmtDur(x.doneWeek)} of ${fmtDur(x.placed)} planned`;
    let lines = '';
    if (passed) lines = `<span class="item-sub">${(c.deadlines || []).length ? 'All deadlines passed' : 'Add a deadline to plan study'} · ${fmtDur(allDone[c.id] || 0)} studied in total</span>`;
    else if (x.need || x.placed) {
      lines = progressBar(x.doneWeek, x.placed, Math.max(x.need, x.placed), c.color, `${c.name}: ${studied}, weekly target ${fmtDur(x.need)}`)
        + `<span class="item-sub${short ? ' short' : ''}">${studied}${short ? ` · ${fmtDur(x.need - x.placed)} short` : ''}</span>`;
    } else lines = `<span class="item-sub">Nothing to plan this week</span>`;
    if (det) {
      const rank = ranked.indexOf(c.id) + 1;
      const next3 = upcoming(c, 4).map(i => `${DL_TYPES[i.dl.type].short} ${fmtDate(i.due)}`).join(', ');
      lines += `${next3 ? `<span class="item-sub">Coming up: ${esc(next3)}</span>` : ''}
        <span class="item-sub">${fmtDur(allDone[c.id] || 0)} studied in total · weekly target ${fmtDur(x.need)}${rank ? ` · priority #${rank}` : ''}</span>
        <span class="item-sub meters-inline">Difficulty${pips(c.difficulty)} Confidence${pips(c.confidence)}</span>`;
    }
    return `<li><button class="item course-card" data-act="edit-course" data-id="${c.id}" aria-label="Edit ${esc(c.name)}. ${esc(examText(c))}. ${esc(studied)}">
      ${countdownHtml(c)}
      <span class="item-main"><span class="item-title">${esc(c.name)}</span><span class="item-sub">${esc(examText(c))}</span>${lines}</span>
    </button></li>`;
  }).join('') + '</ul>';
}

function commitTimeText(c) {
  if (c.flex === 'movable') return `${fmtDur(c.duration)} between ${fmtRange(toMin(c.earliest), toMin(c.latest))}`;
  return fmtRange(toMin(c.start), toMin(c.end));
}
const daysText = days => {
  const s = [...days].sort().join(',');
  if (s === '0,1,2,3,4') return 'Weekdays';
  if (s === '5,6') return 'Weekends';
  if (days.length === 7) return 'Every day';
  return [...days].sort().map(d => DAYS[d]).join(' ');
};

function commitmentsPanel() {
  const head = `<div class="panel-head"><h2>Commitments</h2><span class="row" style="gap:6px"><button class="btn sm" data-act="quick-add" title="Type or paste your class schedule">⚡ Quick add</button><button class="btn sm primary" data-act="add-commit">+ Add</button></span></div>`;
  if (!state.commitments.length) return head + `<div class="empty"><strong>No commitments yet</strong>Add classes, practices, work shifts — anything that takes time each week.<div class="empty-act"><button class="btn sm" data-act="quick-add">Paste your class schedule</button></div></div>`;
  const order = { locked:0, movable:1, skippable:2, optional:3 };
  const sorted = [...state.commitments].sort((a, b) => order[a.flex] - order[b.flex] || a.name.localeCompare(b.name));
  return head + '<ul class="list">' + sorted.map(c => `
    <li><button class="item" data-act="edit-commit" data-id="${c.id}" aria-label="Edit ${esc(c.name)}">
      <span class="item-main"><span class="item-title">${esc(c.name)}</span><span class="item-sub">${esc(daysText(c.days))} · ${esc(commitTimeText(c))}</span>${c.location ? `<span class="item-sub">📍 ${esc(c.location)}</span>` : ''}</span>
      <span class="badge ${c.flex}">${ICON[c.flex]}${FLEX[c.flex].label}</span>
    </button></li>`).join('') + '</ul>';
}

    <input type="checkbox" id="pref-${k}" name="preferred" value="${k}" ${s.preferred.includes(k) ? 'checked' : ''}><label for="pref-${k}">${k[0].toUpperCase() + k.slice(1)}</label>`).join('');
  return `<div class="panel-head"><h2>Settings</h2></div>
  <form class="form" id="settingsForm" novalidate>
    <div class="row">
      <label class="field"><span>Wake up</span><input type="time" name="wake" value="${s.wake}" step="900"></label>
      <label class="field"><span>Sleep</span><input type="time" name="sleep" value="${s.sleep}" step="900"></label>
    </div>
    <div class="row">
      <label class="field"><span>Study session (min)</span><input type="number" name="sessionLen" min="15" max="180" step="5" value="${s.sessionLen}"></label>
