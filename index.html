function bindSettings() {
  const f = $('#settingsForm');
  f.addEventListener('change', () => {
    const fd = new FormData(f);
    const next = {
      wake: fd.get('wake') || state.settings.wake,
      sleep: fd.get('sleep') || state.settings.sleep,
      sessionLen: clamp(Math.round(+fd.get('sessionLen') || 50), 15, 180),
      breakLen: clamp(Math.round(+fd.get('breakLen') || 0), 0, 60),
      maxStudyHours: clamp(+fd.get('maxStudyHours') || 4, 0.5, 14),
      preferred: fd.getAll('preferred'),
    };
    const sl = toMin(next.sleep) === 0 ? 1440 : toMin(next.sleep);
    if (sl - toMin(next.wake) < 240) { $('#settingsErr').textContent = 'Sleep time must be at least 4 hours after wake time (same day; use 00:00 for midnight).'; return; }
    $('#settingsErr').textContent = '';
    state.settings = next;
    // re-plan without re-drawing this form (keeps keyboard focus in the field you're editing)
    save(); refreshPlan(); renderBanner(); renderSummary(); renderCalendar(); toast('Settings saved');
  });
}

// Conflict banner: what's short and why, skip suggestions, and skips you've already accepted
function renderBanner() {
  const el = $('#banner');
  const wd = weekData(plan.ws);
  const skippedNow = plan.skipped;                  // occurrences skipped this week (still existing commitments)
  const rejectedCount = (wd.rejected || []).length;
  if (!plan.shortfalls.length && !skippedNow.length) { el.hidden = true; el.innerHTML = ''; return; }

  let html = '';
  if (plan.shortfalls.length) {
    html += `<div class="banner-head"><span class="banner-icon" aria-hidden="true">!</span>
      <h2>Not enough study time this week</h2></div><ul class="short-list">`;
    plan.shortfalls.forEach(f => {
      const due = f.target.due, nm = esc(dlName(f.target.dl));
      const forTxt = f.examDays <= 7 ? `<b>${nm}</b>, due ${fmtDate(due, { weekday:'short' })} ${fmtDate(due)}` : `this week's share of <b>${nm}</b>, due ${fmtDate(due)}`;
      html += `<li><span class="dot" style="background:${esc(f.course.color)}"></span><span>
        <b>${esc(f.course.name)}</b> needs ${fmtDur(f.need)} for ${forTxt}; only ${fmtDur(f.placed)} fits.
        <b class="short-amt">${fmtDur(f.short)} short.</b> <span class="muted">${esc(shortReason(plan, f))}</span></span></li>`;
    });
    html += '</ul>';

    if (suggestions.length) {
      html += '<h3 class="banner-sub">Suggestions</h3><ul class="sugg-list">';
      suggestions.forEach(sg => {
        const e = sg.ev, k = esc(e.key);
        html += `<li class="sugg"><div class="sugg-text">
            <span>Skipping <b>${DAY_FULL[e.day]}'s ${esc(e.ref.name)}</b> frees ${fmtDur(sg.courseGain)} for <b>${esc(sg.course.name)}</b> (${esc(dlName(sg.target.dl))})${sg.gain > sg.courseGain ? ` (${fmtDur(sg.gain)} total)` : ''}</span>
            <small>${ICON.skippable} ${DAYS[e.day]} ${fmtRange(e.start, e.end)} · Skippable</small></div>
          <div class="sugg-btns">
            <button class="btn sm primary" data-act="skip-accept" data-key="${k}" aria-label="Skip ${esc(e.ref.name)} on ${DAY_FULL[e.day]}">Skip it</button>
            <button class="btn sm" data-act="skip-reject" data-key="${k}" aria-label="Keep ${esc(e.ref.name)} on ${DAY_FULL[e.day]}">Keep</button>
          </div></li>`;
      });
      html += '</ul>';
    } else {
      html += `<p class="banner-note">No skippable commitment this week would free usable time. You could raise your daily max, shorten study sessions, add more preferred times, or mark something else as Skippable.</p>`;
    }
    if (rejectedCount) html += `<p class="banner-note">${rejectedCount} suggestion${rejectedCount > 1 ? 's' : ''} you chose to keep. <button class="linkbtn" data-act="skip-unreject">Show again</button></p>`;
  }

  if (skippedNow.length) {
    html += `<div class="skipped-row"><span class="muted">Skipped this week:</span>` + skippedNow.map(e =>
      `<span class="skip-chip">${esc(e.ref.name)} · ${DAYS[e.day]}<button class="linkbtn" data-act="skip-restore" data-key="${esc(e.key)}" aria-label="Restore ${esc(e.ref.name)} on ${DAY_FULL[e.day]}">Restore</button></span>`).join('') + '</div>';
  }
  el.className = 'banner' + (plan.shortfalls.length ? ' warn' : ' info');
  el.innerHTML = html;
  el.hidden = false;
}

// One-line status of this week's plan
function renderSummary() {
  const el = $('#summary');
  if (!state.courses.length) {
    // commitments but no courses yet: say what's missing instead of showing nothing
    el.innerHTML = state.commitments.length ? `<span>Add a course with its exams or other deadlines and study time will be planned around these commitments.</span> <button class="linkbtn" data-act="add-course">Add a course</button>` : '';
    return;
  }
  const parts = [`<span><b>${fmtDur(plan.studyTotal)}</b> of study planned this week</span>`];
  if (plan.shortfalls.length) {
    parts.push(...plan.shortfalls.map(f =>
      `<span class="chip warn" title="${esc(dlName(f.target.dl))}: needs ${fmtDur(f.need)} this week, only ${fmtDur(f.placed)} fits">${esc(f.course.name)} · ${esc(DL_TYPES[f.target.dl.type].short)}: ${fmtDur(f.short)} short</span>`));
  } else if (plan.studyTotal) parts.push('<span class="chip ok">All courses covered</span>');
  if (plan.movableConflicts.length) parts.push(`<span class="chip warn">${plan.movableConflicts.length} movable item${plan.movableConflicts.length > 1 ? 's' : ''} couldn't fit</span>`);
  if (plan.droppedOptional.length) parts.push(`<span class="chip muted" title="${esc(plan.droppedOptional.map(e => e.ref.name + ' (' + DAYS[e.day] + ')').join(', '))}">${plan.droppedOptional.length} optional hidden (no free time)</span>`);
  el.innerHTML = parts.join('');
}

function renderLegend() {
  $('#legend').innerHTML = Object.entries(FLEX).map(([k, v]) => `<span class="badge ${k}" title="${esc(v.desc)}">${ICON[k]}${v.label}</span>`).join('');
}

/* =========================================================
   Scheduler
   Order: Locked + Skippable (fixed times) → Movable (best slot in window)
          → study sessions (weighted fill) → Optional (only if still free).
   Deterministic: same inputs always give the same week.
   ========================================================= */
const STEP = 15;                                   // candidate start times every 15 min
const weekKey = ws => ymd(ws);
const weekData = ws => state.weeks[weekKey(ws)] || {};
const instKey = (c, d) => c.id + '@' + d;          // one occurrence of a commitment on one weekday

// Total study a course needs before its exam (minutes).
// Harder + less confident = more hours. Range: 1.5h (diff 1, conf 5) to 13.5h (diff 5, conf 1).
const courseNeedMin = c => Math.round((1 + 0.5 * c.difficulty * (6 - c.confidence)) * 60);

// How urgently a deadline should get the next free slot: the course's weight, multiplied up as the due date nears.
const targetPriority = (c, daysToDue) => c.difficulty * (6 - c.confidence) * (1 + 7 / Math.max(1, daysToDue));

/* ---------- deadlines ---------- */
const dayDiff = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / 864e5);
const dlName = dl => dl.title && dl.title.toLowerCase() !== DL_TYPES[dl.type].label.toLowerCase()
  ? `${dl.title} (${DL_TYPES[dl.type].label.toLowerCase()})` : DL_TYPES[dl.type].label;

// Every due date of a course's deadlines between two dates (inclusive). Weekly ones repeat every 7 days
// from their first date (until their end date, if set). `to` may be null for "any time after `from`".
function dlInstances(c, from, to) {
  const out = [];
  (c.deadlines || []).forEach(dl => {
    if (!dl.date) return;
    const d0 = parseYmd(dl.date);
    if (!dl.repeat) { if (d0 >= from && (!to || d0 <= to)) out.push({ dl, due: d0, key: dl.id + '@' + dl.date }); return; }
    const end = dl.until ? parseYmd(dl.until) : null;
    let stop = to || addDays(from, 70);
    if (end && end < stop) stop = end;
    const k = Math.max(0, Math.ceil(dayDiff(from, d0) / 7));
    for (let d = addDays(d0, 7 * k); d <= stop; d = addDays(d, 7)) out.push({ dl, due: d, key: dl.id + '@' + ymd(d) });
  });
  return out.sort((a, b) => a.due - b.due);
}
// the next few things due for a course, from today on
const upcoming = (c, n = 3) => dlInstances(c, startOfDay(new Date()), null).slice(0, n);

// Prep time a deadline needs (minutes): your own estimate if you gave one; exams use the difficulty/confidence
// formula; other types start from a typical amount, scaled the same way (1× at difficulty 3 / confidence 3).
function prepMin(c, dl) {
  if (+dl.hours > 0) return Math.round(dl.hours * 60);
  if (dl.type === 'exam') return courseNeedMin(c);
  const factor = 0.6 + 0.045 * c.difficulty * (6 - c.confidence);
  return Math.max(15, Math.round(DL_TYPES[dl.type].hours * 60 * factor / 5) * 5);
}

function prefWindowOf(mid) {
  return Object.keys(PREF_WINDOWS).find(k => mid >= PREF_WINDOWS[k][0] && mid < PREF_WINDOWS[k][1]);
}

// Minutes of completed study per deadline on days before today (all weeks)
function doneBeforeToday() {
  const today = startOfDay(new Date()), out = {};
  Object.entries(state.weeks).forEach(([wk, w]) => (w.sessions || []).forEach(p => {
    if (p.done && p.tk && addDays(parseYmd(wk), p.day) < today) out[p.tk] = (out[p.tk] || 0) + p.len;
  }));
  return out;
}

// opts.extraSkip: extra Skippable occurrences to treat as skipped (used to test "what if I skipped this?")
function buildPlan(ws, opts = {}) {
  const s = state.settings, wake = wakeMin(), sleep = sleepMin();
  const today = startOfDay(new Date());
  const wd = weekData(ws);
  const skipped = new Set([...(wd.skipped || []), ...(opts.extraSkip || [])]), moved = wd.moved || {};
  const useful = s.sessionLen + s.breakLen;   // a free gap shorter than this can't hold a full session
  const plan = { ws, days: [], courses: [], shortfalls: [], skipped: [], droppedOptional: [], movableConflicts: [], studyTotal: 0 };
  const days = plan.days = DAYS.map((_, i) => ({ i, date: addDays(ws, i), busy: [], events: [], studyMin: 0 }));

  // --- helpers on a day's busy list ---
  const occupy = (day, start, end, ev) => { day.busy.push([start, end]); if (ev) day.events.push(ev); };
  const isFree = (day, start, end) => start >= wake && end <= sleep && day.busy.every(([a, b]) => end <= a || start >= b);
  // minutes left stranded in too-small fragments if [start,end] is taken out of its free gap
  const waste = (day, start, end) => {
    let gs = wake, ge = sleep;
    day.busy.forEach(([a, b]) => { if (b <= start && b > gs) gs = b; if (a >= end && a < ge) ge = a; });
    const L = start - gs, R = ge - end;
    return (L > 0 && L < useful ? L : 0) + (R > 0 && R < useful ? R : 0);
  };
  const starts = (from, to, len) => {            // candidate start times in [from, to-len]
    const out = [];
    for (let t = from; t + len <= to; t += STEP) out.push(t);
    if (to - len >= from && !out.includes(to - len)) out.push(to - len);
    return out;
  };

  // 1. Fixed-time items: Locked always, Skippable unless you accepted a skip this week
  state.commitments.forEach(c => {
    if (c.flex !== 'locked' && c.flex !== 'skippable') return;
    c.days.forEach(d => {
      const start = toMin(c.start), end = toMin(c.end) || 1440, key = instKey(c, d);
      const ev = { kind:'commit', ref:c, flex:c.flex, start, end, day:d, key };
      if (c.flex === 'skippable' && skipped.has(key)) { plan.skipped.push(ev); return; }
      occupy(days[d], start, end, ev);
    });
  });

  // 2. Movable items, tightest window first (least slack = fewest options, so it chooses first)
  const movs = [];
  state.commitments.filter(c => c.flex === 'movable').forEach(c => c.days.forEach(d =>
    movs.push({ c, d, key: instKey(c, d), e: toMin(c.earliest), l: toMin(c.latest) || 1440 })));
  movs.sort((a, b) => ((a.l - a.e) - a.c.duration) - ((b.l - b.e) - b.c.duration));
  movs.forEach(m => {
    const day = days[m.d], dur = m.c.duration;
    let best = null, bestScore = -Infinity, why;
    const pinned = moved[m.key];
    if (pinned != null && isFree(day, pinned, pinned + dur)) { best = pinned; why = 'Placed where you moved it'; }
    else {
      // pick the slot that strands the fewest minutes of free time; earlier wins ties
      starts(m.e, m.l, dur).forEach(t => {
        if (!isFree(day, t, t + dur)) return;
        const sc = -waste(day, t, t + dur) - t / 10000;
        if (sc > bestScore) { bestScore = sc; best = t; }
      });
      why = `Best fit inside its ${fmtRange(m.e, m.l)} window: keeps the rest of your free time in usable blocks`;
    }
    const conflict = best == null;
    if (conflict) { best = m.e; why = `No free ${fmtDur(dur)} inside ${fmtRange(m.e, m.l)}. It overlaps something.`; }
    if (pinned != null && best !== pinned && !conflict) why += '. (The spot you moved it to is now taken, so it was placed automatically.)';
    const ev = { kind:'commit', ref:m.c, flex:'movable', start:best, end:best + dur, day:m.d, key:m.key, why, conflict, moved: pinned != null && best === pinned };
    if (conflict) plan.movableConflicts.push(ev);
    occupy(day, best, best + dur, ev);
  });

  // 3. Study sessions, planned per deadline ("target"): each exam, project, quiz… gets its own prep time.
  // A target's prep is spread evenly over its prep window: from today (or `lead` days before it's due,
  // or the previous week's due date for weekly ones) up to the day before it's due.
  const donePast = doneBeforeToday();
  const weekEnd = addDays(ws, 6), horizon = addDays(ws, 7 + MAX_LEAD);
  plan.targets = [];
  state.courses.forEach(c => dlInstances(c, addDays(today, 1), null).forEach(inst => {
    if (inst.dl.repeat && inst.due > horizon) return;
    const lead = DL_TYPES[inst.dl.type].lead;
    let open = today;                                              // when prep for this one can start
    if (lead != null && addDays(inst.due, -lead) > open) open = addDays(inst.due, -lead);
    if (inst.dl.repeat && addDays(inst.due, -7) > open) open = addDays(inst.due, -7);
    if (open > weekEnd) return;                                    // prep hasn't started by the end of this week
    const allowed = days.filter(d => d.date >= open && d.date < inst.due).map(d => d.i);
    if (!allowed.length && inst.due <= ws) return;                 // already due before this week
    const daysLeft = Math.max(1, dayDiff(inst.due, open));
    const needTotal = Math.max(0, prepMin(c, inst.dl) - (donePast[inst.key] || 0));
    const need = Math.round(needTotal * allowed.length / daysLeft / 5) * 5;
    const daysToDue = dayDiff(inst.due, today);
    plan.targets.push({ key: inst.key, c, dl: inst.dl, due: inst.due, daysToDue, daysLeft, allowed, needTotal, need,
      placed: 0, doneWeek: 0, prio: targetPriority(c, daysToDue), stuck: false, sessions: [] });
  }));
  const byKey = Object.fromEntries(plan.targets.map(t => [t.key, t]));
  const courseDone = {};

  // 3a. Pinned sessions (ones you dragged or checked off) stay exactly where they are
  (wd.sessions || []).forEach(p => {
    const c = state.courses.find(x => x.id === p.courseId);
    if (!c) return;                                   // course was deleted
    const day = days[p.day];
    // the deadline it belongs to; older sessions without one go to the soonest deadline that day can prep for
    let t = p.tk && byKey[p.tk];
    if (!t) t = plan.targets.filter(x => x.c.id === c.id && x.allowed.includes(p.day)).sort((a, b) => a.due - b.due)[0] || null;
    const counts = !!t && t.allowed.includes(p.day);  // only sessions in a deadline's prep window count toward it
    const ev = {
      kind:'study', course:c, target:t, start:p.start, end:p.start + p.len, day:p.day, key:'pin:' + p.id,
      pinned:true, done:!!p.done, missed: !p.done && day.date < today, why: { pref:null, counts },
    };
    occupy(day, p.start, Math.min(sleep, p.start + p.len + s.breakLen), ev);
    if (p.done) { courseDone[c.id] = (courseDone[c.id] || 0) + p.len; if (t) t.doneWeek += p.len; }
    if (counts) { day.studyMin += p.len; t.placed += p.len; plan.studyTotal += p.len; t.sessions.push(ev); }
  });

  const maxDay = s.maxStudyHours * 60;
  const bestStudySlot = (x, len) => {
    let best = null;
    x.allowed.forEach((di, order) => {
      const day = days[di];
      if (day.studyMin + len > maxDay) return;
      // sessions of the same course already that day (any of its deadlines)
      const sameCourse = day.events.filter(v => v.kind === 'study' && v.course.id === x.c.id).length;
      starts(wake, sleep, len).forEach(t => {
        // the session plus its break after must be free (break may be cut off by bedtime)
        if (!isFree(day, t, Math.min(sleep, t + len + s.breakLen))) return;
        const win = prefWindowOf(t + len / 2);
        const pref = win && s.preferred.includes(win);
        const score = (pref ? 3 : 0)          // your preferred study times first
          - sameCourse * 2.5                  // spread a course across days
          - day.studyMin / 60 * 0.6           // balance daily load
          - order * 0.2                       // slight preference for earlier days
          - waste(day, t, t + len + s.breakLen) / 60
          + (t % 30 === 0 ? 0.2 : 0);         // tidy start times
        if (!best || score > best.score) best = { score, di, t, pref, win, sameCourse, dayLoad: day.studyMin };
      });
    });
    return best;
  };

  for (let guard = 0; guard < 400; guard++) {
    const open = plan.targets.filter(x => !x.stuck && x.need - x.placed >= 15);
    if (!open.length) break;
    // deadline with the highest priority × share of its weekly target still missing goes next
    open.sort((a, b) => b.prio * (b.need - b.placed) / b.need - a.prio * (a.need - a.placed) / a.need);
    const x = open[0], rem = x.need - x.placed;
    let len = rem >= s.sessionLen ? s.sessionLen : Math.max(20, Math.ceil(rem / 5) * 5);
    if (rem > len && rem - len < 15) len = rem;   // fold a tiny leftover into this session instead of dropping it
    let slot = bestStudySlot(x, len);
    // no room for a full session? try a short one in a smaller gap / the last bit of the daily cap
    for (const short of [30, 20]) { if (slot || len <= short) continue; len = short; slot = bestStudySlot(x, len); }
    if (!slot) { x.stuck = true; continue; }
    const day = days[slot.di];
    const ev = {
      kind:'study', course:x.c, target:x, start:slot.t, end:slot.t + len, day:slot.di,
      key: `study:${x.key}:${slot.di}:${slot.t}`,
      why: { pref: slot.pref ? slot.win : null, win: slot.win, firstToday: slot.sameCourse === 0, dayLoad: slot.dayLoad, counts: true },
    };
    occupy(day, slot.t, Math.min(sleep, slot.t + len + s.breakLen), ev);
    day.studyMin += len; x.placed += len; x.sessions.push(ev); plan.studyTotal += len;
  }

  // 4. Optional items: only if their whole time is still free
  state.commitments.filter(c => c.flex === 'optional').forEach(c => c.days.forEach(d => {
    const start = toMin(c.start), end = toMin(c.end) || 1440, key = instKey(c, d);
    const ev = { kind:'commit', ref:c, flex:'optional', start, end, day:d, key };
    if (isFree(days[d], start, end)) occupy(days[d], start, end, ev); else plan.droppedOptional.push(ev);
  }));

  // 5. Shortfalls: deadlines whose share of prep this week didn't fit
  plan.shortfalls = plan.targets
    .filter(x => x.need - x.placed >= 15)
    .map(x => ({ course: x.c, target: x, need: x.need, placed: x.placed, short: x.need - x.placed, examDays: x.daysToDue }))
    .sort((a, b) => a.examDays - b.examDays);

  // 6. Per-course totals for the sidebar and tooltips (sum of that course's deadlines this week)
  plan.courses = state.courses.map(c => {
    const ts = plan.targets.filter(t => t.c.id === c.id);
    const next = upcoming(c, 1)[0];
    return { c, targets: ts,
      need: ts.reduce((a, t) => a + t.need, 0), placed: ts.reduce((a, t) => a + t.placed, 0),
      doneWeek: courseDone[c.id] || 0, prio: ts.reduce((a, t) => Math.max(a, t.need ? t.prio : 0), 0),
      daysLeft: next ? dayDiff(next.due, today) : -1 };
  });
  return plan;
}

/* =========================================================
   Conflicts: explain shortfalls and suggest Skippable items to drop
   ========================================================= */
const DAY_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const totalShort = p => p.shortfalls.reduce((a, f) => a + f.short, 0);

// this week's editable overrides (created on first use)
function weekMut() {
  const k = weekKey(weekStart());
  const w = state.weeks[k] || (state.weeks[k] = {});
  w.skipped = w.skipped || []; w.rejected = w.rejected || []; w.moved = w.moved || {}; w.sessions = w.sessions || [];
  return w;
}

// Why a course came up short, in plain words
function shortReason(p, f) {
  const x = f.target;
  const max = state.settings.maxStudyHours * 60;
  const roomy = x.allowed.filter(di => p.days[di].studyMin + 20 <= max);
  const daysTxt = x.allowed.length === 1 ? 'only 1 study day is left, and it is' : `only ${x.allowed.length} study days are left, and they are`;
  if (!roomy.length) return `Every study day before it's due is already at your ${state.settings.maxStudyHours}h daily max.`;
  if (x.allowed.length <= 3) return `It's due soon, so ${daysTxt} full.`;
  return 'The free gaps left are too small for another session.';
}

// Try skipping each Skippable occurrence on its own; keep the ones that recover real study time.
function skipSuggestions(p) {
  if (!p.shortfalls.length) return [];
  const wd = weekData(p.ws), rejected = new Set(wd.rejected || []);
  const before = totalShort(p), out = [];
  p.days.forEach(day => day.events.forEach(ev => {
    if (ev.kind !== 'commit' || ev.flex !== 'skippable' || rejected.has(ev.key)) return;
    const alt = buildPlan(p.ws, { extraSkip: [ev.key] });
    const gain = before - totalShort(alt);
    if (gain < 15) return;                         // not worth suggesting
    // which short course benefits most from this skip?
    let best = null;
    p.shortfalls.forEach(f => {
      const at = alt.targets.find(x => x.key === f.target.key), now = at ? at.placed : f.placed;
      const g = now - f.placed;
      if (g > 0 && (!best || g > best.g)) best = { g, course: f.course, target: f.target };
    });
    const pick = best || { g: gain, course: p.shortfalls[0].course, target: p.shortfalls[0].target };
    out.push({ ev, gain, course: pick.course, target: pick.target, courseGain: pick.g });
  }));
  return out.sort((a, b) => b.gain - a.gain || a.ev.day - b.ev.day);
}

let plan = null, suggestions = [];
const refreshPlan = () => { plan = buildPlan(weekStart()); suggestions = skipSuggestions(plan); };
const courseStats = id => plan && plan.courses.find(x => x.c.id === id);

// assign side-by-side lanes for overlapping events within a day
function layoutLanes(items) {
  items.sort((a, b) => a.start - b.start || b.end - a.end);
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    const lanes = [];
    cluster.forEach(it => {
      let l = lanes.findIndex(e => e <= it.start);
      if (l < 0) { l = lanes.length; lanes.push(0); }
      lanes[l] = it.end; it.lane = l;
    });
    cluster.forEach(it => it.lanes = lanes.length);
    cluster = [];
  };
  items.forEach(it => {
    if (cluster.length && it.start >= clusterEnd) { flush(); clusterEnd = -1; }
    cluster.push(it); clusterEnd = Math.max(clusterEnd, it.end);
  });
  if (cluster.length) flush();
  return items;
}

function renderCalendar() {
  const cal = $('#cal');
  const wake = wakeMin(), sleep = sleepMin();
  // show the waking day plus a little margin, snapped to hours
  const gStart = Math.max(0, Math.floor((wake - 30) / 60) * 60);
  const gEnd = Math.min(1440, Math.ceil((sleep + 30) / 60) * 60);
  grid = { gStart, gEnd };      // remembered for dragging
  const height = (gEnd - gStart) * PPM;
  const ws = weekStart(), todayStr = ymd(new Date());
  const hourPx = 60 * PPM;
  const gridBg = `background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px ${hourPx}px);background-position:0 0`;

  let html = '<div class="cal-grid"><div class="cal-head cal-corner"></div>';
  DAYS.forEach((d, i) => {
    const date = addDays(ws, i), isToday = ymd(date) === todayStr;
    // deadline markers: a small pill in the header of each day something is due (exam, project, quiz…)
    const exams = state.courses.flatMap(c => dlInstances(c, date, date).map(inst => ({ c, inst })));
    const pills = exams.map(({ c, inst }) => `<span class="exam-pill" style="--c:${esc(c.color)}" title="${esc(c.name)}: ${esc(dlName(inst.dl))} due">${esc(DL_TYPES[inst.dl.type].short)} · ${esc(c.name)}</span>`).join('');
    html += `<div class="cal-head${isToday ? ' today' : ''}${exams.length ? ' has-exam' : ''}" ${isToday ? 'aria-current="date"' : ''}>${d}<b>${date.getDate()}</b>${pills}</div>`;
  });

  html += `<div class="gutter" style="height:${height}px;position:sticky">`;
  for (let m = gStart + 60; m < gEnd; m += 60) html += `<span class="hour" style="top:${(m - gStart) * PPM}px">${fmtTime(m)}</span>`;
  html += '</div>';

  if (!plan) refreshPlan();
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  DAYS.forEach((d, i) => {
    const date = addDays(ws, i), isToday = ymd(date) === todayStr;
    html += `<div class="day${isToday ? ' today' : ''}" style="height:${height}px;${gridBg}" data-day="${i}" aria-label="${fmtDate(date, { weekday:'long', month:'long', day:'numeric' })}">`;
    if (wake > gStart) html += `<div class="offhours" style="top:0;height:${(wake - gStart) * PPM}px"></div>`;
    if (sleep < gEnd) html += `<div class="offhours" style="top:${(sleep - gStart) * PPM}px;bottom:0"></div>`;
    // skipped items: faint full-width outline behind everything (click to restore)
    plan.skipped.filter(e => e.day === i).forEach(e => html += ghostHtml(e, gStart, gEnd));
    // detailed view: Optional items that didn't fit, as dotted outlines
    if (state.ui.detailed) plan.droppedOptional.filter(e => e.day === i).forEach(e => html += droppedHtml(e, gStart, gEnd));
    layoutLanes([...plan.days[i].events]).forEach(e => html += blockHtml(e, gStart, gEnd));
    if (isToday && nowMin >= gStart && nowMin <= gEnd) html += `<div class="nowline" style="top:${(nowMin - gStart) * PPM}px" aria-hidden="true"></div>`;
    html += '</div>';
  });
  html += '</div>';

  if (!state.courses.length && !state.commitments.length) {
    html += `<div class="cal-empty"><div class="card"><h3>Your week is a blank page</h3>
      <p>Add your courses and weekly commitments, or load sample data to explore.</p>
      <div class="row"><button class="btn primary" data-act="add-course">Add a course</button><button class="btn" data-act="load-sample">Load sample</button></div></div></div>`;
  }
  cal.innerHTML = html;
  // remember which blocks exist so the next render only animates new ones
  shownKeys = new Set(plan.days.flatMap(d => d.events.map(e => e.key)));
}

// blocks that weren't on screen last render get a gentle entrance
let shownKeys = null;
const enterCls = key => shownKeys && !shownKeys.has(key) ? ' enter' : '';

function droppedHtml(e, gStart, gEnd) {
  const s = clamp(e.start, gStart, gEnd), en = clamp(e.end, gStart, gEnd);
  if (en <= s) return '';
  const label = `${e.ref.name} (Optional) not scheduled on ${DAYS[e.day]}: no free time at ${fmtRange(e.start, e.end)}`;
  return `<div class="blk ghost dropped" style="top:${(s - gStart) * PPM}px;height:${Math.max(18, (en - s) * PPM - 2)}px;left:2px;width:calc(100% - 4px)" title="${esc(label)}" aria-hidden="true">
    <span class="t">${esc(e.ref.name)}</span><span class="s">No free time</span></div>`;
}

function blockHtml(e, gStart, gEnd) {
  const s = clamp(e.start, gStart, gEnd), en = clamp(e.end, gStart, gEnd);
  if (en <= s) return '';
  const top = (s - gStart) * PPM, h = Math.max(18, (en - s) * PPM - 2);
  const w = 100 / e.lanes;
  const style = `top:${top}px;height:${h}px;left:calc(${e.lane * w}% + 2px);width:calc(${w}% - 4px)`;
  if (e.kind === 'study') return studyBlockHtml(e, style, h);
  const c = e.ref;
  const sub = (c.flex === 'movable'
    ? `${fmtRange(e.start, e.end)} · window ${fmtRange(toMin(c.earliest), toMin(c.latest))}`
    : fmtRange(e.start, e.end)) + (c.location ? ` · ${c.location}` : '');
  let label = `${c.name}, ${FLEX[c.flex].label}, ${DAYS[e.day]} ${sub}`;
  if (e.why) label += `. ${e.why}`;
  const mov = c.flex === 'movable';
  // Movable blocks: draggable within their window, with a rich tooltip instead of the plain title
  const extra = mov ? `data-key="${esc(e.key)}" data-drag="movable" data-tip aria-describedby="tip"` : `title="${esc(label)}"`;
  const showSub = state.ui.detailed && h > 30;
  return `<button class="blk ${c.flex}${e.conflict ? ' conflict' : ''}${mov && e.moved ? ' pinned' : ''}${enterCls(e.key)}" style="${style}" data-act="edit-commit" data-id="${c.id}" ${mov ? `data-key="${esc(e.key)}"` : ''} aria-label="${esc(label)}" ${extra}>
    <span class="t">${ICON[c.flex]}${esc(c.name)}</span>${showSub ? `<span class="s">${esc(sub)}</span>` : ''}</button>`;
}

function ghostHtml(e, gStart, gEnd) {
  const s = clamp(e.start, gStart, gEnd), en = clamp(e.end, gStart, gEnd);
  if (en <= s) return '';
  const label = `${e.ref.name} skipped this week (${DAYS[e.day]} ${fmtRange(e.start, e.end)}). Click to restore.`;
  return `<button class="blk ghost" style="top:${(s - gStart) * PPM}px;height:${Math.max(18, (en - s) * PPM - 2)}px;left:2px;width:calc(100% - 4px)"
    data-act="skip-restore" data-key="${esc(e.key)}" aria-label="${esc(label)}" title="${esc(label)}">
    <span class="t">${esc(e.ref.name)}</span><span class="s">Skipped</span></button>`;
}

/* ---------- explain-why ---------- */
const cap1 = s => s[0].toUpperCase() + s.slice(1);
const CHECK = '<svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// Every reason behind a study block, in plain words (used by the tooltip and the session panel)
function whyItems(e) {
  const w = e.why || {}, c = e.course, t = e.target, items = [];
  if (e.done) items.push('Completed. Counts toward your progress.');
  else if (e.missed) items.push('This day has passed. Tick it if you did it.');
  if (t) {
    // which deadline this prepares for, how soon it's due, and how much prep it needs
    const nm = dlName(t.dl), dueTxt = fmtDate(t.due, { weekday:'short', month:'short', day:'numeric' });
    items.push(t.daysToDue <= 1 ? `Prep for ${nm}, due tomorrow (${dueTxt}), so it's top priority`
      : `Prep for ${nm}, due in ${t.daysToDue} days (${dueTxt})${t.daysToDue <= 5 ? '. Close, so it gets extra weight' : ''}`);
    items.push(+t.dl.hours > 0 ? `You estimated ${fmtDur(prepMin(c, t.dl))} of prep for it`
      : `Difficulty ${c.difficulty}/5 and confidence ${c.confidence}/5 → about ${fmtDur(prepMin(c, t.dl))} of prep for this ${DL_TYPES[t.dl.type].label.toLowerCase()}`);
    if (t.dl.repeat) items.push(`Repeats weekly, so prep starts after the previous one is due`);
  } else items.push('Not linked to an upcoming deadline');
  const ranked = plan.courses.filter(x => x.need > 0).sort((a, b) => b.prio - a.prio);
  const rank = ranked.findIndex(x => x.c.id === c.id) + 1;
  if (rank) items.push(`Priority #${rank} of ${ranked.length} course${ranked.length > 1 ? 's' : ''} this week`);
  if (e.pinned) items.push('You placed this session, so the planner keeps it here');
  else {
    items.push(w.pref ? `${cap1(w.pref)}: one of your preferred study times`
      : `${w.win ? cap1(w.win) + " isn't a preferred time, but this" : 'This'} was the best free gap left`);
    if (w.firstToday) items.push(`First ${c.name} session that day: spreads study across the week`);
  }
  if (!w.counts && !e.done) items.push("Doesn't count toward this week's target (past day, or outside a deadline's prep window)");
  return items;
}
function targetLine(c) {
  const x = courseStats(c.id);
  if (!x) return '';
  return `This week: ${fmtDur(x.placed)} planned of ${fmtDur(x.need)} target · ${fmtDur(x.doneWeek)} done`;
}

function studyBlockHtml(e, style, h) {
  const c = e.course, k = esc(e.key);
  const cls = (e.done ? ' done' : '') + (e.missed ? ' missed' : '') + (e.pinned ? ' pinned' : '');
  const label = `Study ${c.name}, ${DAY_FULL[e.day]} ${fmtRange(e.start, e.end)}${e.done ? ', done' : ''}. Opens course and session details.`;
  // the wrapper is what you drag; inside: the main button (opens the course editor, same as the sidebar) and the ✓ button
  // simple view: course name only; detailed: time, plus the top reason on taller blocks
  const det = state.ui.detailed;
  const reason = det && h > 46 && !e.done ? `<span class="s why">${esc(whyItems(e)[e.missed ? 1 : 0].split(/[.(]/)[0])}</span>` : '';
  return `<div class="blk study${cls}${enterCls(e.key)}" style="${style};--c:${esc(c.color)}" data-key="${k}" ${e.done ? '' : 'data-drag="study"'} data-tip>
    <button class="blk-main" data-act="edit-course" data-id="${esc(c.id)}" data-key="${k}" aria-label="${esc(label)}" aria-describedby="tip">
      <span class="t">${e.pinned && !e.done ? '<span class="pin" aria-hidden="true">•</span>' : ''}${esc(c.name)}</span>${det && h > 30 ? `<span class="s">${e.done ? 'Done' : 'Study'} · ${fmtRange(e.start, e.end)}</span>` : ''}${reason}</button>
    <button class="chk" data-act="toggle-done" data-key="${k}" aria-pressed="${e.done}" aria-label="${e.done ? 'Mark not done' : 'Mark done'}: ${esc(c.name)}, ${DAY_FULL[e.day]} ${fmtRange(e.start, e.end)}">${CHECK}</button>
  </div>`;
}

/* ---------- session actions ---------- */
const findEvent = key => plan && plan.days.flatMap(d => d.events).find(e => e.key === key);

// Auto-placed sessions change whenever the plan is rebuilt, so the moment you touch one
// (check it off or drag it) it becomes a pinned session saved for this week.
function pinSession(ev, changes = {}) {
  const w = weekMut();
  let rec = ev.pinned ? w.sessions.find(p => 'pin:' + p.id === ev.key) : null;
  // tk remembers which deadline the session prepares for, so it keeps counting toward it
  if (!rec) { rec = { id: uid(), courseId: ev.course.id, tk: ev.target ? ev.target.key : null, day: ev.day, start: ev.start, len: ev.end - ev.start, done: false }; w.sessions.push(rec); }
  Object.assign(rec, changes);
  return rec;
}
function toggleDone(key) {
  const ev = findEvent(key);
  if (!ev) return;
  const rec = pinSession(ev, { done: !ev.done });
  commit(rec.done ? `${fmtDur(rec.len)} of ${ev.course.name} done` : 'Marked as not done');
  refocus(`.chk[data-key="pin:${rec.id}"]`);
}
function unpinSession(key) {
  const w = weekMut();
  w.sessions = w.sessions.filter(p => 'pin:' + p.id !== key);
  commit('Session handed back to the planner');
}
// put keyboard focus back on an element after a re-render
function refocus(sel) { const el = $(sel, $('#cal')); if (el) el.focus({ preventScroll: true }); }

   Dialogs: course & commitment editors

const scale = (name, val, low, high) => `<div class="seg">${[1,2,3,4,5].map(i =>

// sessionKey: set when opened from a study block, which adds a "This session" panel on top

/* =========================================================
   Quick add: read a typed or pasted class schedule
   Example lines it understands:
     Calculus II, MWF 9-10:15am, Thornton Hall 101
     BIO 2010 TuTh 2pm-3:15pm Gilmer 130
     Organic Chem Lab  Wed 1:00–4:00 PM  Chem Bldg B12
     9:00-9:50 M/W/F Intro Psychology | Nau Hall 101
   ========================================================= */
const DAY_LOOKUP = {};
[[0, ['monday','mon','mo','m']], [1, ['tuesday','tues','tue','tu','t']], [2, ['wednesday','weds','wed','we','w']],
 [3, ['thursday','thurs','thur','thu','th','r']], [4, ['friday','fri','fr','f']], [5, ['saturday','sat','sa']], [6, ['sunday','sun','su']]]
  .forEach(([i, words]) => words.forEach(w => { DAY_LOOKUP[w] = i; }));
const CONNECTORS = new Set(['at', 'from', 'on', '@', '&', 'and', ',', '|', '-', ';', ':', '·', 'every']);

// One word → the weekdays it names, or null. Handles "Mon", "Th", "M-F", "Mon/Wed", and compact codes like "MWF", "TTh", "TuTh", "MoWeFr".
function tokenDays(raw) {
  const tok = raw.replace(/^[,.;:|()]+|[,.;:|()]+$/g, '');
  if (!tok) return null;
  const low = tok.toLowerCase();
  if (low in DAY_LOOKUP) return [DAY_LOOKUP[low]];
  if (low === 'daily' || low === 'everyday') return [0,1,2,3,4,5,6];
  if (low === 'weekdays') return [0,1,2,3,4];
  if (low === 'weekends') return [5,6];
  if (/[\/+&]/.test(tok)) {                                    // Mon/Wed, Tu/Th, M+W
    const parts = tok.split(/[\/+&]/).filter(Boolean).map(tokenDays);
    return parts.length && parts.every(Boolean) ? [...new Set(parts.flat())] : null;
  }
  const rg = low.match(/^([a-z]+)-([a-z]+)$/);                 // M-F, Mon-Fri
  if (rg && rg[1] in DAY_LOOKUP && rg[2] in DAY_LOOKUP) {
    const out = []; for (let d = DAY_LOOKUP[rg[1]]; out.length < 7; d = (d + 1) % 7) { out.push(d); if (d === DAY_LOOKUP[rg[2]]) break; }
    return out;
  }
  // compact codes in any letter case: "MWF", "mwf", "TTh", "tth", "TR", "MoWeFr", "mowefr".
  // Days are only looked for next to the time (or in the Days field), and a few real words built from
  // day letters are excluded, so ordinary words aren't mistaken for days.
  if (/^(th|tu|mo|we|fr|sa|su|m|t|w|r|f)+$/i.test(tok) && !['wet', 'tut', 'mom', 'mfr', 'turf'].includes(low)) {
    const out = [];
    low.replace(/th|tu|mo|we|fr|sa|su|m|t|w|r|f/g, u => { out.push(DAY_LOOKUP[u]); return ''; });
    return [...new Set(out)];
  }
  return null;
}

// "9", "00", "am" → minutes since midnight, working out am/pm when it's missing
function resolveTimes(h1, m1, s1, h2, m2, s2) {
  const conv = (h, m, s) => s ? ((h % 12) + (s === 'p' ? 12 : 0)) * 60 + m : h * 60 + m;
  const notes = [];
  if (!s1 && !s2) {
    if (h1 > 12 || h2 > 12 || h1 === 0) return { start: conv(h1, m1), end: conv(h2, m2), notes };   // 24-hour clock
    s1 = h1 >= 7 && h1 <= 11 ? 'a' : 'p';                       // classes 7–11 → morning, 12–6 → afternoon
    notes.push(`No am/pm given, so I assumed ${s1 === 'a' ? 'morning' : 'afternoon'}`);
  }
  if (!s1) s1 = s2;
  if (!s2) s2 = s1;
  let a = conv(h1, m1, s1), b = conv(h2, m2, s2);
  if (b <= a && s1 === s2) {                                   // "11-12:15pm" means 11am–12:15pm
    const a2 = conv(h1, m1, s1 === 'p' ? 'a' : 'p');
    if (a2 < b) a = a2; else { const b2 = conv(h2, m2, 'p'); if (b2 > a) b = b2; }
  }
  return { start: a, end: b, notes };
}

// A time: "9", "9:30", "11.30", or without a separator "930" / "1130" / "1400"
const T_RE = '(\\d{3,4}|\\d{1,2}(?:[:.]\\d{2})?)';
const SUF_RE = '(a\\.?m\\.?|p\\.?m\\.?|a|p)?';
const sufOf = x => x ? x[0].toLowerCase() : '';
function splitTime(t) {
  if (/[:.]/.test(t)) { const [h, m] = t.split(/[:.]/); return { h: +h, m: +m, sep: true, compact: false }; }
  if (t.length >= 3) return { h: +t.slice(0, -2), m: +t.slice(-2), sep: false, compact: true };   // "1130" → 11:30
  return { h: +t, m: 0, sep: false, compact: false };
}
const validTime = x => x.h <= 24 && x.m < 60;
const normLine = t => t.replace(/[–—−]/g, '-').replace(/\bnoon\b/gi, '12pm').replace(/\s+/g, ' ');

// Find the class time in a piece of text → { start, end, notes, index, length } or null.
// Course codes can look like times ("CS 2100-001"), so every candidate is scored: am/pm and ":" make it
// clearly a time, a bare 3–4 digit number counts against it, and later in the line wins ties.
function findTime(s) {
  const range = new RegExp(`\\b${T_RE}\\s*${SUF_RE}\\s*(?:-|to|until)\\s*${T_RE}\\s*${SUF_RE}(?![a-z0-9])`, 'gi');
  let best = null;
  for (const m of s.matchAll(range)) {
    const a = splitTime(m[1]), b = splitTime(m[3]);
    if (!validTime(a) || !validTime(b)) continue;
    const score = (m[2] || m[4] ? 3 : 0) + (a.sep || b.sep ? 2 : 0) - (a.compact || b.compact ? 1 : 0) + m.index / 1000;
    if (!best || score > best.score) best = { m, a, b, score };
  }
  if (best) {
    const t = resolveTimes(best.a.h, best.a.m, sufOf(best.m[2]), best.b.h, best.b.m, sufOf(best.m[4]));
    return { ...t, index: best.m.index, length: best.m[0].length };
  }
  // only a start time ("Yoga Sat 9am", "1130 am"): it needs am/pm to count, and lasts 1 hour
  const single = new RegExp(`\\b${T_RE}\\s*(a\\.?m\\.?|p\\.?m\\.?)(?![a-z])`, 'gi');
  for (const m of s.matchAll(single)) {
    const a = splitTime(m[1]);
    if (!validTime(a)) continue;
    const t = resolveTimes(a.h, a.m, sufOf(m[2]), a.h, a.m, sufOf(m[2]));
    return { start: t.start, end: t.start + 60, notes: [...t.notes, 'No end time, so I assumed 1 hour'], index: m.index, length: m[0].length };
  }
  return null;
}

// A field that is only days ("MWF", "Tue & Thu", "Mon/Wed") → sorted weekday numbers, else null
function daysOfText(text) {
  const days = [];
  for (const tok of text.trim().split(/\s+/)) {
    const d = tokenDays(tok);
    if (d) days.push(...d);
    else if (!CONNECTORS.has(tok.toLowerCase())) return null;
  }
  return days.length ? [...new Set(days)].sort() : null;
}

// Read one line into { name, days, start, end, location, notes, problems }
function parseScheduleLine(line) {
  const src = line.trim();
  const out = { src, name: '', days: [], start: null, end: null, location: '', notes: [], problems: [] };
  const checkEnd = () => { if (out.start != null && (out.end <= out.start || out.end > 1440)) out.problems.push('End time is before the start time'); };

  // 1. The suggested format, "Class name, Days, Time, Location" (commas or tabs): read the fields in order
  const fields = src.split(/\s*(?:\t+|,|\|)\s*/).map(f => f.trim()).filter(Boolean);
  if (fields.length >= 3) {
    const days = daysOfText(normLine(fields[1]));
    const t = days && findTime(' ' + normLine(fields[2]) + ' ');
    if (days && t) {
      Object.assign(out, { name: fields[0].slice(0, 60), days, start: t.start, end: t.end, location: fields.slice(3).join(', ').slice(0, 80) });
      out.notes.push(...t.notes); checkEnd();
      return out;
    }
  }

  // 2. Anything else: find the time, then the days next to it; name before, location after
  const s = ' ' + normLine(src.replace(/\t+/g, ' | ')) + ' ';
  let before, after;
  const t = findTime(s);
  if (t) {
    Object.assign(out, { start: t.start, end: t.end }); out.notes.push(...t.notes);
    before = s.slice(0, t.index); after = s.slice(t.index + t.length);
  } else {
    out.problems.push('No time found');
    before = s; after = '';
  }
  checkEnd();

  // days: look right before the time first ("MWF 9-10"), then right after it ("9-10 MWF")
  const takeDays = (text, fromEnd) => {
    const toks = text.trim().split(' ').filter(Boolean);
    const days = []; let i = fromEnd ? toks.length - 1 : 0, seen = false;
    while (i >= 0 && i < toks.length) {
      const tk = toks[i], d = tokenDays(tk);
      if (d) { days.push(...d); seen = true; }
      else if (!CONNECTORS.has(tk.toLowerCase().replace(/[,.]$/, '')) && !/^[,|;:·-]+$/.test(tk)) break;
      i += fromEnd ? -1 : 1;
    }
    if (!seen) return null;
    const rest = fromEnd ? toks.slice(0, i + 1) : toks.slice(i);
    return { days: [...new Set(days)].sort(), rest: rest.join(' ') };
  };
  let found = out.start != null ? takeDays(before, true) : null;
  if (found) before = found.rest;
  else if ((found = takeDays(after, false))) after = found.rest;
  else if (out.start == null && (found = takeDays(before, true))) before = found.rest;   // no time: days may end the line
  if (found) out.days = found.days; else out.problems.push('No days found');

  // name = text before the days/time, location = text after; strip separators and "at/in/@"
  const clean = t => t.replace(/^[\s,|;:·@-]+|[\s,|;:·@-]+$/g, '').replace(/^(at|in|room:?)\s+/i, m => /room/i.test(m) ? m : '').trim();
  out.name = clean(before); out.location = clean(after);
  if (!out.name && out.location) {                              // "9-10 MWF Calculus, Room 5": name came after
    const parts = out.location.split(/\s*(?:,|\||;| - )\s*/);
    out.name = parts.shift(); out.location = parts.join(', ');
  }
  if (!out.name) out.problems.push('No class name found');
  out.name = out.name.slice(0, 60); out.location = out.location.slice(0, 80);
  return out;
}

// "Calculus II Lecture" / "BIO 2010 Lab" → "Calculus II" / "BIO 2010" (so lecture + lab make one course)
const courseBase = n => n.replace(/\s*[-–(]?\s*\b(lecture|lec|lab|laboratory|discussion|disc|recitation|rec|seminar|sem|tutorial|section\s*\w+)\b\)?\s*$/i, '').trim() || n;

function quickAddDialog() {
  openDialog(`
    <h2 id="dlgTitle">Quick add classes</h2>
    <div class="qa-format-box">
      <div class="qa-format-label">One class per line, in this order, separated by commas:</div>
      <div class="qa-format" aria-label="Format: class name, days, time, location (optional)">
        <span>Class name</span><i aria-hidden="true">,</i><span>Days</span><i aria-hidden="true">,</i><span>Time</span><i aria-hidden="true">,</i><span class="opt">Location <small>(optional)</small></span>
      </div>
      <div class="qa-example"><span class="muted">Example:</span> <code>Calculus II, MWF, 9:00-10:15am, Thornton Hall 101</code></div>
      <div class="hint" style="margin:0">Days: <code>MWF</code> <code>TTh</code> <code>TuTh</code> <code>Mon/Wed</code> <code>M-F</code> · Times: <code>9-10:15am</code> <code>1130am-1245pm</code> <code>930-1045</code> <code>14:00-15:15</code>. Pasting from your school's portal usually works too, even if it isn't in this order.</div>
    </div>
    <label class="field"><span>Your schedule</span>
      <textarea name="qa" rows="5" spellcheck="false" placeholder="Calculus II, MWF, 9:00-10:15am, Thornton Hall 101&#10;BIO 2010, TuTh, 1130am-1245pm, Gilmer 130&#10;Organic Chem Lab, Wed, 1-4pm"></textarea></label>
    <div class="row-btns" style="align-items:center"><button type="button" class="btn sm" id="qaRead">Read schedule</button><span class="hint" id="qaCount" style="margin:0">Ctrl+Enter also reads it.</span></div>
    <div id="qaRows" class="qa-rows" aria-live="polite"></div>
    <div class="error" role="alert"></div>
    <div class="dlg-actions">
      <span class="spacer"></span>
      <button type="button" class="btn" data-dlg="cancel">Cancel</button>
      <button type="submit" class="btn primary" id="qaAdd" disabled>Add classes</button>
    </div>`, fd => submitQuickAdd(fd), 'textarea');

  const ta = $('textarea', dlgForm);

  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); read(); } });
  ta.addEventListener('paste', () => setTimeout(read, 0));     // pasting reads it right away
}

let qaParsed = [];
function renderQuickRows(text) {
  qaParsed = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(parseScheduleLine);
  const box = $('#qaRows'), err = $('.error', dlgForm);
  err.textContent = '';
  if (!qaParsed.length) { box.innerHTML = ''; $('#qaAdd').disabled = true; $('#qaCount').textContent = 'Type or paste at least one line.'; return; }
  const have = new Set(state.courses.map(c => courseBase(c.name).toLowerCase()));
  const batch = new Set();
  box.innerHTML = qaParsed.map((p, i) => {
    const ok = !p.problems.length;
    // offer to create the course too, unless it already exists (or an earlier line in this batch adds it)
    const base = courseBase(p.name).toLowerCase(), exists = have.has(base), dup = batch.has(base);
    if (base) batch.add(base);
    const chips = DAYS.map((d, di) => `<input type="checkbox" id="qa${i}d${di}" name="d${i}" value="${di}" ${p.days.includes(di) ? 'checked' : ''}><label for="qa${i}d${di}">${d[0]}${d === 'Thu' ? 'h' : d === 'Sat' || d === 'Sun' ? d[1] : ''}</label>`).join('');
    const msgs = [...p.problems.map(t => `<span class="qa-bad">⚠ ${esc(t)}</span>`), ...p.notes.map(t => `<span class="qa-note">${esc(t)}</span>`)].join(' ');
    return `<fieldset class="qa-row${ok ? '' : ' bad'}">
      <legend class="qa-src"><label class="chk-line"><input type="checkbox" name="inc${i}" ${ok ? 'checked' : ''}> <span>Line ${i + 1}:</span> <code>${esc(p.src)}</code></label></legend>
      ${msgs ? `<div class="qa-msgs">${msgs}</div>` : ''}
      <div class="qa-grid">
        <label class="field qa-name"><span>Name</span><input name="n${i}" value="${esc(p.name)}" maxlength="60"></label>
        <div class="field qa-days"><span>Days</span><div class="seg mini">${chips}</div></div>
        <label class="field qa-start"><span>Start</span><input type="time" name="s${i}" value="${p.start != null ? toHHMM(p.start) : ''}" step="300"></label>
        <label class="field qa-end"><span>End</span><input type="time" name="e${i}" value="${p.end != null && p.end <= 1440 ? toHHMM(p.end % 1440 === 0 && p.end ? 0 : p.end) : ''}" step="300"></label>
        <label class="field qa-loc"><span>Location</span><input name="l${i}" value="${esc(p.location)}" maxlength="80"></label>
        <label class="field qa-flex"><span>Flexibility</span><select name="f${i}">${['locked', 'skippable', 'optional'].map(f => `<option value="${f}">${FLEX[f].label}</option>`).join('')}</select></label>
      </div>
      <div class="qa-opts">
        ${exists ? `<span class="hint" style="margin:0">Course "${esc(courseBase(p.name))}" already exists, so its study time is already planned.</span>`
          : `<label class="chk-line"><input type="checkbox" name="c${i}" ${dup ? '' : 'checked'}> Also add as a course (for study planning)</label>
             <span class="chk-line">First deadline <select name="t${i}" class="qa-date" aria-label="First deadline type">${Object.entries(DL_TYPES).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('')}</select>
               <input type="date" name="x${i}" class="qa-date" aria-label="First deadline date"> <small class="muted">(optional)</small></span>`}
      </div>
    </fieldset>`;
  }).join('');
  const good = qaParsed.filter(p => !p.problems.length).length;
  $('#qaCount').textContent = `Read ${qaParsed.length} line${qaParsed.length > 1 ? 's' : ''}: ${good} ready${good < qaParsed.length ? `, ${qaParsed.length - good} need fixing (tick them once fixed)` : ''}. Check the details, then add.`;
  $('#qaAdd').disabled = false;
}

function submitQuickAdd(fd) {
  if (!qaParsed.length) return 'Read your schedule first.';
  const rows = [], newCourses = [];
  for (let i = 0; i < qaParsed.length; i++) {
    if (!fd.get('inc' + i)) continue;
    const name = (fd.get('n' + i) || '').trim(), days = fd.getAll('d' + i).map(Number);
    const st = fd.get('s' + i), en = fd.get('e' + i);
    if (!name) return `Line ${i + 1}: add a name.`;
    if (!days.length) return `Line ${i + 1}: pick at least one day.`;
    if (!st || !en) return `Line ${i + 1}: set a start and end time.`;
    if ((toMin(en) || 1440) <= toMin(st)) return `Line ${i + 1}: the end time must be after the start time.`;
    rows.push({ id: uid(), name, days, flex: fd.get('f' + i) || 'locked', start: st, end: en, location: (fd.get('l' + i) || '').trim() });
    if (fd.get('c' + i)) newCourses.push({ name: courseBase(name), dueDate: fd.get('x' + i) || '', dueType: fd.get('t' + i) || 'exam' });
  }
  if (!rows.length) return 'Tick at least one line to add.';

  // skip classes that are already in your commitments (same name, days and times)
  const sig = c => [c.name.toLowerCase(), [...c.days].sort().join(''), c.start, c.end].join('|');
  const existing = new Set(state.commitments.map(sig));
  const fresh = rows.filter(r => !existing.has(sig(r)));
  state.commitments.push(...fresh);

  const seen = new Set(state.courses.map(c => courseBase(c.name).toLowerCase()));
  let noDate = 0, added = 0;
  newCourses.forEach(nc => {
    const k = nc.name.toLowerCase();
    if (seen.has(k)) return;
    seen.add(k);
    if (!nc.dueDate) noDate++;
    // a first deadline only if you gave a date; otherwise the course waits for you to add its deadlines
    const deadlines = nc.dueDate ? [{ id: uid(), type: nc.dueType, title: '', date: nc.dueDate, hours: null, repeat: false, until: '' }] : [];
    state.courses.push({ id: uid(), name: nc.name, color: PALETTE[state.courses.length % PALETTE.length], difficulty: 3, confidence: 3, deadlines });
    added++;
  });
  // if courses were created, show them so you can add deadlines and set difficulty and confidence
  if (added) state.ui.tab = 'courses';
  const skipped = rows.length - fresh.length;
  commit(`Added ${fresh.length} class${fresh.length === 1 ? '' : 'es'}${added ? ` and ${added} course${added > 1 ? 's' : ''}` : ''}${skipped ? ` (${skipped} already there)` : ''}`
    + (noDate ? `. ${noDate} course${noDate > 1 ? 's have' : ' has'} no deadlines yet: add exams, projects or quizzes in Courses` : ''));
}

/* =========================================================
   Global events
   ========================================================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.closest('dialog')) return;
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'add-course': state.ui.tab = 'courses'; render(); courseDialog(); break;
    case 'edit-course': courseDialog(id, t.dataset.key); break;
    case 'add-commit': commitDialog(); break;
    case 'quick-add': quickAddDialog(); break;     // available from both the Courses and Commitments tabs
    case 'edit-commit': commitDialog(id, t.dataset.key); break;
    case 'toggle-done': toggleDone(t.dataset.key); break;
    case 'load-sample': loadSample(); break;
    // conflict banner actions (all scoped to the week on screen)
    case 'skip-accept': {
      const w = weekMut(), key = t.dataset.key, name = skipName(key);
      if (!w.skipped.includes(key)) w.skipped.push(key);
      commit(`Skipped ${name}. Schedule updated`); focusBanner(); break;
    }
    case 'skip-reject': {
      const w = weekMut(), key = t.dataset.key;
      if (!w.rejected.includes(key)) w.rejected.push(key);
      commit(`Keeping ${skipName(key)}`); focusBanner(); break;
    }
    case 'skip-restore': {
      const w = weekMut(), key = t.dataset.key;
      w.skipped = w.skipped.filter(k => k !== key);
      commit(`Restored ${skipName(key)}`); focusBanner(); break;
    }
    case 'skip-unreject': weekMut().rejected = []; commit(); focusBanner(); break;
  }
});

// "Club meeting (Thu)" from an occurrence key like "abc123@3"
function skipName(key) {
  const [id, d] = key.split('@'), c = state.commitments.find(x => x.id === id);
  return c ? `${c.name} (${DAYS[+d]})` : 'item';
}
// after the banner re-renders, keep keyboard focus inside it instead of losing it to <body>
function focusBanner() {
  const b = $('#banner');
  const target = b.hidden ? $('#cal') : ($('[data-act="skip-accept"]', b) || $('[data-act="skip-restore"]', b) || b);
  if (target === b || target === $('#cal')) target.tabIndex = -1;
  target.focus({ preventScroll: true });
}

$$('.tab').forEach(t => {
  t.addEventListener('click', () => { state.ui.tab = t.dataset.tab; save(); renderTabs(); renderPanel(); });
  t.addEventListener('keydown', e => {   // arrow keys move between tabs
    if (!['ArrowLeft','ArrowRight'].includes(e.key)) return;
    const tabs = $$('.tab'), i = tabs.indexOf(t);
    const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    n.click(); n.focus();
  });
});

$('#prevWeek').onclick = () => { state.ui.weekOffset--; commit(); };
$('#nextWeek').onclick = () => { state.ui.weekOffset++; commit(); };
$('#thisWeek').onclick = () => { state.ui.weekOffset = 0; commit(); scrollToToday(); };

/* ---------- Simple / Detailed view ---------- */
function setDetailed(on) { state.ui.detailed = on; commit(on ? 'Detailed view' : 'Simple view'); }
$('#viewSimple').onclick = () => setDetailed(false);
$('#viewDetailed').onclick = () => setDetailed(true);

// On narrow screens the week scrolls sideways inside the calendar: bring today's column into view
function scrollToToday() {
  const cal = $('#cal'), col = $('.day.today', cal);
  if (!col || cal.scrollWidth <= cal.clientWidth) return;
  cal.scrollLeft = Math.max(0, col.offsetLeft - 60);
}

/* ---------- Keyboard shortcuts (ignored while typing or in a dialog) ---------- */
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || dlg.open) return;
  if (e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
  const k = e.key.toLowerCase();
  if (k === '[') $('#prevWeek').click();
  else if (k === ']') $('#nextWeek').click();
  else if (k === 't') $('#thisWeek').click();
  else if (k === 'd') setDetailed(!state.ui.detailed);
  else return;
  e.preventDefault();
});

function loadSample() {
  if ((state.courses.length || state.commitments.length) && !confirm('Replace your current courses and commitments with sample data?')) return;
  const keep = state.settings;
  state = sampleState();
  state.settings = keep;
  commit('Sample data loaded');
}
const dataMenu = $('#dataMenu');
const closeMenu = () => { dataMenu.open = false; };
$('#clearAll').onclick = () => {
  closeMenu();
  if (!confirm('Clear all courses, commitments, settings and progress? This cannot be undone. (Tip: Export first to keep a backup.)')) return;
  state = defaultState();
  commit('Everything cleared');
};
// close the Data menu on outside click or Escape
document.addEventListener('click', e => { if (dataMenu.open && !dataMenu.contains(e.target)) closeMenu(); });
dataMenu.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMenu(); $('summary', dataMenu).focus(); } });
dataMenu.addEventListener('click', e => { if (e.target.closest('[data-act="load-sample"]')) closeMenu(); });

/* ---------- Export / Import ---------- */
// Export: the whole state as a .json file you can keep as a backup or move to another device
$('#exportBtn').onclick = () => {
  closeMenu();
  const blob = new Blob([JSON.stringify({ app: 'study-planner', exported: new Date().toISOString(), ...state }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `study-planner-${ymd(new Date())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Exported your planner');
};
$('#importBtn').onclick = () => { closeMenu(); $('#importFile').value = ''; $('#importFile').click(); };

// Check an imported file looks like planner data before replacing anything
function validateImport(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) return 'That file is not planner data.';
  if (!Array.isArray(d.courses) || !Array.isArray(d.commitments)) return 'That file is missing courses or commitments.';
  const time = /^\d{2}:\d{2}$/, date = /^\d{4}-\d{2}-\d{2}$/;
  for (const c of d.courses) {
    if (!c || typeof c.name !== 'string') return 'A course in that file has no name.';
    // older files have one examDate; newer ones a list of deadlines
    if (c.examDate != null && !date.test(c.examDate)) return `Course "${c.name}" has an invalid exam date.`;
    if (c.deadlines != null && (!Array.isArray(c.deadlines) || c.deadlines.some(x => !x || !date.test(x.date || ''))))
      return `Course "${c.name}" has a deadline without a valid date.`;
  }
  for (const c of d.commitments) {
    if (!c || typeof c.name !== 'string' || !Array.isArray(c.days) || !FLEX[c.flex]) return `Commitment "${c && c.name}" is not valid.`;
    const ok = c.flex === 'movable' ? time.test(c.earliest) && time.test(c.latest) && c.duration > 0 : time.test(c.start) && time.test(c.end);
    if (!ok) return `Commitment "${c.name}" has invalid times.`;
  }
  return null;
}
$('#importFile').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch { toast("Couldn't read that file: it isn't valid JSON"); return; }
  const err = validateImport(data);
  if (err) { toast(err); return; }
  if (!confirm(`Replace everything with "${f.name}"? (${data.courses.length} courses, ${data.commitments.length} commitments)`)) return;
  // re-issue ids that might be missing, clamp the 1–5 scales, keep defaults for anything absent
  const next = migrate(data);
  delete next.app; delete next.exported;
  next.courses.forEach(c => { c.id = c.id || uid(); c.difficulty = clamp(+c.difficulty || 3, 1, 5); c.confidence = clamp(+c.confidence || 3, 1, 5); c.color = /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : PALETTE[0]; });
  next.commitments.forEach(c => { c.id = c.id || uid(); c.days = c.days.map(Number).filter(d => d >= 0 && d <= 6); });
  state = next;
  commit('Imported');
};

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* =========================================================
   Tooltips (explain-why) for study and Movable blocks
   ========================================================= */
const tip = $('#tip'), calEl = $('#cal');
let grid = { gStart: 0, gEnd: 1440 };

function tipHtml(ev) {
  if (ev.kind === 'study') {
    return `<div class="tip-head" style="--c:${esc(ev.course.color)}"><b>${esc(ev.course.name)}</b><span>${DAYS[ev.day]} ${fmtRange(ev.start, ev.end)}</span></div>
      <div class="tip-sub">Why this session</div>
      <ul>${whyItems(ev).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <div class="tip-foot">${esc(targetLine(ev.course))}</div>
      <div class="tip-foot">${ev.done ? 'Click ✓ to undo' : 'Drag to move · ✓ to mark done · Alt+arrows from keyboard'}</div>`;
  }
  const c = ev.ref;
  return `<div class="tip-head" style="--c:var(--movable)"><b>${esc(c.name)}</b><span>${DAYS[ev.day]} ${fmtRange(ev.start, ev.end)}</span></div>
    <ul><li>${esc(ev.why)}</li><li>Allowed window: ${fmtRange(toMin(c.earliest), toMin(c.latest))}, ${fmtDur(c.duration)}</li></ul>
    <div class="tip-foot">Drag up or down within its window · Alt+↑/↓ from keyboard</div>`;
}
function showTip(el) {
  const ev = findEvent(el.dataset.key);
  if (!ev || drag) return;
  tip.innerHTML = tipHtml(ev);
  tip.hidden = false;
  // place to the right of the block, or to the left if there's no room; keep it on screen
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.right + 8;
  if (x + tw > innerWidth - 8) x = r.left - tw - 8;
  if (x < 8) x = clamp(r.left, 8, innerWidth - tw - 8);
  const y = clamp(r.top, 8, innerHeight - th - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.hidden = true; };
calEl.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el && e.pointerType !== 'touch') showTip(el); });
calEl.addEventListener('pointerout', e => { const el = e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });
calEl.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
calEl.addEventListener('focusout', hideTip);
calEl.addEventListener('scroll', hideTip, { passive: true });

/* =========================================================
   Dragging: Movable blocks within their window, study blocks anywhere free
   ========================================================= */
let drag = null, suppressClick = false;

// Things a dragged block may not overlap: fixed commitments, Movable items, pinned study.
// Auto-placed study and Optional items don't block, since the planner re-flows them around your move.
const isHard = o => o.kind === 'study' ? o.pinned : o.flex !== 'optional';

function canPlace(ev, di, start) {
  const end = start + (ev.end - ev.start), d = plan.days[di];
  if (ev.kind === 'study') {
    if (d.date < startOfDay(new Date())) return { ok: false, reason: 'that day has passed' };
    if (ev.target && d.date >= ev.target.due) return { ok: false, reason: `that is on or after ${dlName(ev.target.dl)} is due` };
  }
  const hit = d.events.find(o => o !== ev && isHard(o) && o.start < end && start < o.end);
  if (hit) return { ok: false, reason: `overlaps ${hit.kind === 'study' ? hit.course.name : hit.ref.name}` };
  return { ok: true };
}
// earliest/latest start allowed while dragging
function dragLimits(ev) {
  const len = ev.end - ev.start;
  if (ev.kind === 'study') return { min: wakeMin(), max: sleepMin() - len };
  return { min: toMin(ev.ref.earliest), max: (toMin(ev.ref.latest) || 1440) - len };
}
function colAt(x) {
  const col = $$('.day', calEl).find(c => { const r = c.getBoundingClientRect(); return x >= r.left && x < r.right; });
  return col ? +col.dataset.day : null;
}

// Save a move (from dragging or the keyboard)
function applyMove(ev, di, start) {
  if (ev.kind === 'study') {
    const rec = pinSession(ev, { day: di, start });
    commit(`${ev.course.name} pinned to ${DAYS[di]} ${fmtRange(start, start + rec.len)}`);
    return `[data-key="pin:${rec.id}"] .blk-main`;
  }
  weekMut().moved[ev.key] = start;
  commit(`${ev.ref.name} moved to ${fmtRange(start, start + ev.ref.duration)}`);
  return `[data-key="${ev.key}"]`;
}

function startDrag() {
  const d = drag;
  d.started = true;
  hideTip();
  d.blk.classList.add('dragging');
  d.blk.style.left = '2px'; d.blk.style.width = 'calc(100% - 4px)';
  d.label = document.createElement('span');
  d.label.className = 'drag-time';
  d.blk.appendChild(d.label);
  if (d.ev.kind === 'movable' || d.ev.flex === 'movable') {
    // highlight the allowed window in this day's column
    const c = d.ev.ref, e0 = toMin(c.earliest), l0 = toMin(c.latest) || 1440;
    const w = document.createElement('div');
    w.className = 'drop-window';
    w.style.top = (e0 - grid.gStart) * PPM + 'px';
    w.style.height = (l0 - e0) * PPM + 'px';
    w.innerHTML = `<span>Allowed: ${fmtRange(e0, l0)}</span>`;
    d.blk.parentElement.appendChild(w);
  } else {
    // highlight the days this course can be studied on
    calEl.classList.add('dragging-study');
    $$('.day', calEl).forEach(col => {
      const di = +col.dataset.day, date = plan.days[di].date;
      const ok = date >= startOfDay(new Date()) && (!d.ev.target || date < d.ev.target.due);
      col.classList.add(ok ? 'drop-ok' : 'drop-no');
    });
  }
}

calEl.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const blk = e.target.closest('[data-drag]');
  if (!blk || e.target.closest('.chk')) return;
  const ev = findEvent(blk.dataset.key);
  if (!ev || ev.done) return;
  drag = { blk, ev, x0: e.clientX, y0: e.clientY, id: e.pointerId, started: false, day: ev.day, start: ev.start, ok: true };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.started) { if (Math.hypot(dx, dy) < 5) return; startDrag(); }
  e.preventDefault();
  const ev = drag.ev, len = ev.end - ev.start, lim = dragLimits(ev);
  // vertical movement → time (snapped to 5 min); horizontal → day (study only)
  const start = clamp(Math.round((ev.start + dy / PPM) / 5) * 5, lim.min, lim.max);
  const di = ev.kind === 'study' ? (colAt(e.clientX) ?? drag.day) : ev.day;
  const res = canPlace(ev, di, start);
  Object.assign(drag, { day: di, start, ok: res.ok });
  const col = $(`.day[data-day="${di}"]`, calEl);
  if (drag.blk.parentElement !== col) col.appendChild(drag.blk);
  drag.blk.style.top = (start - grid.gStart) * PPM + 'px';
  drag.blk.classList.toggle('invalid', !res.ok);
  drag.label.textContent = res.ok ? fmtRange(start, start + len) : `Can't: ${res.reason}`;
});
function endDrag(e, cancelled) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  const d = drag; drag = null;
  calEl.classList.remove('dragging-study');
  if (!d.started) return;                       // it was a plain click: let it through
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  const changed = d.day !== d.ev.day || d.start !== d.ev.start;
  if (cancelled || !changed) { renderCalendar(); return; }
  if (!d.ok) { toast(`Can't move it there: ${d.label.textContent.replace("Can't: ", '')}`); renderCalendar(); return; }
  refocus(applyMove(d.ev, d.day, d.start));
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));
// swallow the click that follows a drag so it doesn't open the editor
document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

// Keyboard: Alt+↑/↓ moves 15 min, Alt+←/→ moves a study block one day. Esc cancels a drag.
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideTip(); if (drag) { drag.started ? endDrag(null, true) : (drag = null); } return; }
  if (!e.altKey || !['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const blk = e.target.closest && e.target.closest('[data-drag]');
  if (!blk || !calEl.contains(blk)) return;
  const ev = findEvent(blk.dataset.key);
  if (!ev) return;
  e.preventDefault();
  const lim = dragLimits(ev);
  let di = ev.day, start = ev.start;
  if (e.key === 'ArrowUp') start -= 15;
  if (e.key === 'ArrowDown') start += 15;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (ev.kind !== 'study') { toast('Movable items stay on their day. Use Alt+↑/↓.'); return; }
    di += e.key === 'ArrowLeft' ? -1 : 1;
    if (di < 0 || di > 6) return;
  }
  if (start < lim.min || start > lim.max) { toast(ev.kind === 'study' ? 'That would be outside your waking hours' : `That's outside its ${fmtRange(toMin(ev.ref.earliest), toMin(ev.ref.latest))} window`); return; }
  const res = canPlace(ev, di, start);
  if (!res.ok) { toast(`Can't move it there: ${res.reason}`); return; }
  refocus(applyMove(ev, di, start));
});

// keep the "now" line fresh (not while dragging or editing)
setInterval(() => { if (state.ui.weekOffset === 0 && !dlg.open && !drag) renderCalendar(); }, 60000);

render();
// first load: start at the top of the waking day, and on phones show today's column
$('#cal').scrollTop = 0;
scrollToToday();
</script>
</body>
</html>
